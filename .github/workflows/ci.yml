name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend + frontend tests live in tests.yml (also used as the gate before image pushes in
  # deploy.yml and docker-build.yml). Shown on GitHub as "Tests / Backend Tests (Python)" etc.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: p7erp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: false
          tags: p7erp-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_ALLOWED_HOSTS: localhost,127.0.0.1
          MCP_HUMAN_APPROVAL_SECRET: dummy_secret_for_ci
          AI_CONFIRMATION_TOKEN_PEPPER: dummy_pepper_for_ci

      - name: Validate docker-compose.prod.yml
        env:
          MCP_HUMAN_APPROVAL_SECRET: "dummy_secret_for_ci"
          AI_CONFIRMATION_TOKEN_PEPPER: "dummy_pepper"
          CORS_ORIGINS: "*"
        run: docker compose -f docker-compose.prod.yml config > /dev/null
