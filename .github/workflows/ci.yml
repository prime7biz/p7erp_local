name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with pylint (optional)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pylint
          find . -name "*.py" -type f | grep -v __pycache__ | head -20 | xargs pylint --disable=all --enable=E,F || true

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key
          GEMINI_ENABLED: "false"
          OLLAMA_ENABLED: "false"
          VLLM_ENABLED: "false"
        run: |
          pytest -v --tb=short

  frontend-test:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: p7erp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: false
          tags: p7erp-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_ALLOWED_HOSTS: localhost,127.0.0.1
          MCP_HUMAN_APPROVAL_SECRET: dummy_secret_for_ci
          AI_CONFIRMATION_TOKEN_PEPPER: dummy_pepper_for_ci

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config > /dev/null
        env:
          JWT_SECRET: dummy_jwt_secret_for_ci
          MCP_HUMAN_APPROVAL_SECRET: dummy_secret_for_ci
          AI_CONFIRMATION_TOKEN_PEPPER: dummy_pepper_for_ci
          CORS_ORIGINS: http://localhost
          BACKEND_IMAGE: dummy_image
          FRONTEND_IMAGE: dummy_image
