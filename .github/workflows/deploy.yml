# Semantic versioning: production deploy (SSH) runs on v* tags; server .env pins to ${{ github.ref_name }}.
name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: prime7biz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            prime7biz/p7erp-backend:latest
            prime7biz/p7erp-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            prime7biz/p7erp-frontend:latest
            prime7biz/p7erp-frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_RUN_USER="primeadmin"
            TAG="${{ github.ref_name }}"
            # SSH login is often root; docker compose runs as primeadmin on the live host.
            sudo -u "${APP_RUN_USER}" -H bash -lc "
              set -euo pipefail
              cd \"${APP_DIR}\"
              git pull origin main
              touch .env
              sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d;/^APP_VERSION=/d' .env
              echo \"BACKEND_IMAGE=prime7biz/p7erp-backend:${TAG}\" >> .env
              echo \"FRONTEND_IMAGE=prime7biz/p7erp-frontend:${TAG}\" >> .env
              echo \"APP_VERSION=${TAG}\" >> .env
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
              docker compose -f docker-compose.prod.yml exec -T backend alembic current
            "
