# Build and push application images to Docker Hub.
#
# Repo secrets (Settings → Secrets and variables → Actions → Repository secrets):
#   DOCKERHUB_TOKEN   – Docker Hub access token (required; if blank, login fails with "Username and password required")
#   VITE_API_BASE_URL – Passed as build-arg to frontend images (same as deploy workflow)
# Docker Hub namespace is fixed to prime7biz (matches deploy-admin.yml).
#
# Triggers: pushes to main/dev/develop, version tags v*, and manual workflow_dispatch.

name: Docker Hub Build

on:
  push:
    branches: [main, dev, develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: prime7biz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: prime7biz/p7erp-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: prime7biz/p7erp-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Extract metadata (frontend-admin)
        id: meta-frontend-admin
        uses: docker/metadata-action@v5
        with:
          images: prime7biz/p7erp-frontend-admin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend-admin
        uses: docker/build-push-action@v5
        with:
          context: frontend-admin
          file: frontend-admin/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend-admin.outputs.tags }}
          labels: ${{ steps.meta-frontend-admin.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
