# Build and push application images to Docker Hub.
#
# Repo secrets (Settings → Secrets and variables → Actions → Repository secrets):
#   DOCKERHUB_TOKEN   – Docker Hub access token (required; if blank, login fails with "Username and password required")
#   VITE_API_BASE_URL – Passed as build-arg to frontend images (same as deploy workflow)
# Docker Hub namespace is fixed to prime7biz (matches deploy-admin.yml).
#
# Semantic versioning: tags v1.0.0 etc. Each run pushes :latest and :${{ github.ref_name }} (main or v*).
# Triggers: pushes to main, version tags v*, and manual workflow_dispatch.
# Images are pushed only after the shared tests (tests.yml) pass.

name: Docker Hub Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: images are pushed only after backend + frontend tests pass (same jobs as CI, tests.yml).
  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-and-push:
    name: Build and push to Docker Hub
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: prime7biz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same as deploy.yml: keep the live release's hashed files in the new frontend image.
      - name: Resolve previous frontend image
        id: previous
        run: |
          git fetch --tags --force --quiet || true
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | grep -vxF -- "${GITHUB_REF_NAME}" | head -n1 || true)
          image="nginx:1.27-alpine"
          if [[ -n "${prev_tag}" ]]; then
            digest=$(docker buildx imagetools inspect "prime7biz/p7erp-frontend:${prev_tag}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ "${digest}" == sha256:* ]]; then image="prime7biz/p7erp-frontend@${digest}"; fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Previous frontend image: ${prev_tag:-none} -> $image"

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            prime7biz/p7erp-backend:latest
            prime7biz/p7erp-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            prime7biz/p7erp-frontend:latest
            prime7biz/p7erp-frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_PWA_ENABLED=${{ vars.VITE_PWA_ENABLED || 'false' }}
            VITE_ANDROID_APK_URL=${{ vars.VITE_ANDROID_APK_URL || '' }}
            VITE_PLAY_STORE_URL=${{ vars.VITE_PLAY_STORE_URL || '' }}
            VITE_PLAUSIBLE_DOMAIN=${{ vars.VITE_PLAUSIBLE_DOMAIN || '' }}
            PRERENDER_HYDRATE=${{ vars.PRERENDER_HYDRATE || 'false' }}
            PREVIOUS_FRONTEND_IMAGE=${{ steps.previous.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend-admin
        uses: docker/build-push-action@v5
        with:
          context: frontend-admin
          file: frontend-admin/Dockerfile.prod
          push: true
          tags: |
            prime7biz/p7erp-frontend-admin:latest
            prime7biz/p7erp-frontend-admin:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
