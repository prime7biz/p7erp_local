# Shared test jobs (backend pytest + frontend lint/typecheck/build/test).
# Not triggered on its own: CI, Deploy and Docker Hub Build call it with `uses:` so the
# Docker image build/push jobs only run after these tests pass. Edit tests here, once.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # CPU torch first (keep in sync with TORCH_VERSION in backend/Dockerfile) so pip never pulls CUDA wheels.
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          alembic upgrade head

      - name: Lint with pylint (optional)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pylint
          find . -name "*.py" -type f | grep -v __pycache__ | head -20 | xargs pylint --disable=all --enable=E,F || true

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key
          GEMINI_ENABLED: "false"
          OPENROUTER_ENABLED: "false"
          OPENROUTER_API_KEY: ""
          OLLAMA_ENABLED: "false"
          VLLM_ENABLED: "false"
        run: |
          pytest -v --tb=short

  frontend-test:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test
