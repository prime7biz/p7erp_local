# Production compose pulls prebuilt images from Docker Hub.
# Set BACKEND_IMAGE and FRONTEND_IMAGE in the repo root `.env`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    # Memory tuning for a small VPS shared with Ollama + API + Celery. Override any value in the
    # server .env (e.g. PG_SHARED_BUFFERS=1GB on a 8 GB host). Changing these needs a Postgres
    # restart (brief downtime). pg_stat_statements also needs a one-time
    # `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` (see docs/DEPLOYMENT_PROCESS.md).
    # idle_in_transaction_session_timeout stays 0 (off): background jobs hold an advisory-lock
    # connection idle inside a transaction for the whole job (app/common/background_lock.py).
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c idle_in_transaction_session_timeout=${PG_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}
      -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      -c shared_preload_libraries=pg_stat_statements
    # Docker's default 64 MB /dev/shm is too small for parallel queries with these settings.
    shm_size: ${PG_SHM_SIZE:-256mb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p7erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p7erp}
      POSTGRES_DB: ${POSTGRES_DB:-p7erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p7erp} -d ${POSTGRES_DB:-p7erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "gemma2:2b-instruct-q4_K_M"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

  backend:
    image: ${BACKEND_IMAGE:-your-dockerhub-user/p7erp-backend:latest}
    restart: always
    environment: &backend_env
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-dev}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-p7erp}:${POSTGRES_PASSWORD:-p7erp}@postgres:5432/${POSTGRES_DB:-p7erp}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      TENANT_STRATEGY: ${TENANT_STRATEGY:-header}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_TIER1_PREFERRED: ${OPENROUTER_TIER1_PREFERRED:-true}
      OPENROUTER_TENANT_TEXT_ENABLED: ${OPENROUTER_TENANT_TEXT_ENABLED:-true}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-P7 ERP}
      AI_MONTHLY_BUDGET_LIMIT: ${AI_MONTHLY_BUDGET_LIMIT:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b-instruct-q4_K_M}
      VLLM_ENABLED: ${VLLM_ENABLED:-false}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-1024}
      PAID_LLM_PROVIDER: ${PAID_LLM_PROVIDER:-}
      PAID_LLM_API_KEY: ${PAID_LLM_API_KEY:-}
      PAID_LLM_MODEL: ${PAID_LLM_MODEL:-}
      PAID_LLM_BASE_URL: ${PAID_LLM_BASE_URL:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_REQUIRE_AUTH: ${MCP_REQUIRE_AUTH:-true}
      MCP_COMMIT_BYPASS: ${MCP_COMMIT_BYPASS:-false}
      MCP_HUMAN_APPROVAL_SECRET: ${MCP_HUMAN_APPROVAL_SECRET:?MCP_HUMAN_APPROVAL_SECRET must be set for production MCP approvals}
      AI_CONFIRMATION_TOKEN_PEPPER: ${AI_CONFIRMATION_TOKEN_PEPPER}
      # Email / SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-Prime7 ERP}
      FRONTEND_URL: ${FRONTEND_URL:-https://prime7erp.com}
      # DB pool per process. API: 2 uvicorn workers x (10 + 10) = 40 connections max.
      # worker/beat override these below; total must stay under PG_MAX_CONNECTIONS (100).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      PERF_SESSION_STATEMENT_TIMEOUT_MS: ${PERF_SESSION_STATEMENT_TIMEOUT_MS:-0}
      PERF_SESSION_LOCK_TIMEOUT_MS: ${PERF_SESSION_LOCK_TIMEOUT_MS:-0}
      # true = alert scans / weekly AI report / platform maintenance run inside the API process.
      # Switch to false only after beat + worker are healthy (docs/DEPLOYMENT_PROCESS.md).
      INPROCESS_SCHEDULERS_ENABLED: ${INPROCESS_SCHEDULERS_ENABLED:-true}
      ALERT_SCAN_LOG_RETENTION_DAYS: ${ALERT_SCAN_LOG_RETENTION_DAYS:-30}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # Backend must not wait for ollama-init (large model pull); otherwise API is down for a long time.
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    # Fewer workers than CPU count to leave headroom for Ollama on shared low-spec hosts.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure

  # Celery worker + beat (scheduled GST/stock/MIS jobs). Beat must stay at 1 replica.
  # Both wait for backend healthy: backend runs `alembic upgrade head` before uvicorn, so tasks
  # never run against a half-migrated schema.
  worker:
    image: ${BACKEND_IMAGE:-your-dockerhub-user/p7erp-backend:latest}
    restart: always
    environment:
      <<: *backend_env
      # Each Celery child process has its own pool: CELERY_CONCURRENCY x (2 + 3) = 10 max by default.
      DB_POOL_SIZE: ${CELERY_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${CELERY_DB_MAX_OVERFLOW:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    command: celery -A app.common.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  beat:
    image: ${BACKEND_IMAGE:-your-dockerhub-user/p7erp-backend:latest}
    restart: always
    environment:
      <<: *backend_env
      # Beat only schedules; it never runs tasks.
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - backend_media:/app/media
    command: celery -A app.common.celery_app.celery_app beat --loglevel=info --schedule /app/media/celerybeat-schedule
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure

  frontend:
    image: ${FRONTEND_IMAGE:-your-dockerhub-user/p7erp-frontend:latest}
    restart: always
    # Wait until /health succeeds; otherwise nginx proxies to a backend that is still
    # running migrations or not listening yet → 502 on /api/* in the browser.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/primeadmin/.docker/config.json:/config.json
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=false
    command: --include-stopped --revive-stopped --interval 300

volumes:
  postgres_data:
  backend_media:
  ollama_data:
