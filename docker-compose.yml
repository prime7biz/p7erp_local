services:
  postgres:
    # pgvector extension required for AI embedding chunks (Alembic 125+)
    image: pgvector/pgvector:pg16
    restart: always
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: p7erp
      POSTGRES_PASSWORD: p7erp
      POSTGRES_DB: p7erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p7erp -d p7erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "llama3"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://p7erp:p7erp@postgres:5432/p7erp
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TENANT_STRATEGY: header
      WATCHFILES_FORCE_POLLING: "true"
      # Gemini (read from repo root .env when running: docker compose up)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
      AI_MONTHLY_BUDGET_LIMIT: ${AI_MONTHLY_BUDGET_LIMIT:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      VLLM_ENABLED: ${VLLM_ENABLED:-false}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-1024}
      PAID_LLM_PROVIDER: ${PAID_LLM_PROVIDER:-}
      PAID_LLM_API_KEY: ${PAID_LLM_API_KEY:-}
      PAID_LLM_MODEL: ${PAID_LLM_MODEL:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_REQUIRE_AUTH: ${MCP_REQUIRE_AUTH:-true}
      MCP_COMMIT_BYPASS: ${MCP_COMMIT_BYPASS:-false}
      MCP_HUMAN_APPROVAL_SECRET: ${MCP_HUMAN_APPROVAL_SECRET:-dev-local-mcp-approval-secret}
      AI_CONFIRMATION_TOKEN_PEPPER: ${AI_CONFIRMATION_TOKEN_PEPPER:-change-me-ai-token-pepper}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./backend:/app
    # Stable mode: avoid reload restarts (prevents intermittent 502s behind nginx).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS}
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 1000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    restart: always
    ports:
      # Main app uses 5173; admin UI is at http://localhost:5174/admin/
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
