services:
  postgres:
    # pgvector extension required for AI embedding chunks (Alembic 125+)
    image: pgvector/pgvector:pg16
    restart: always
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: p7erp
      POSTGRES_PASSWORD: p7erp
      POSTGRES_DB: p7erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p7erp -d p7erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional connection pooler (enable with USE_PGBOUNCER=true on backend). Local/staging only until validated.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: always
    environment:
      DATABASE_URL: postgres://p7erp:p7erp@postgres:5432/p7erp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Required for backend REDIS_URL, /health (ping), and rate limits. Prefer full stack:
  #   docker compose up -d
  # If you start only some services, include redis (e.g. postgres redis backend).
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "gemma2:2b-instruct-q4_K_M"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

  backend:
    image: p7erp_local-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://p7erp:p7erp@postgres:5432/p7erp
      USE_PGBOUNCER: ${USE_PGBOUNCER:-false}
      DATABASE_URL_PGBOUNCER: ${DATABASE_URL_PGBOUNCER:-postgresql://p7erp:p7erp@pgbouncer:5432/p7erp}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TENANT_STRATEGY: header
      WATCHFILES_FORCE_POLLING: "true"
      # Gemini (read from repo root .env when running: docker compose up)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Tier-1 AI uses OpenRouter when configured, else Ollama. Gemini features off by default.
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # More slugs: docs/OPENROUTER.md — nvidia/nemotron-3-super-120b-a12b:free, x-ai/grok-4.1-fast, Gemma :free variants
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_TIER1_PREFERRED: ${OPENROUTER_TIER1_PREFERRED:-true}
      OPENROUTER_TENANT_TEXT_ENABLED: ${OPENROUTER_TENANT_TEXT_ENABLED:-true}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-P7 ERP}
      AI_MONTHLY_BUDGET_LIMIT: ${AI_MONTHLY_BUDGET_LIMIT:-0}
      # Per-tenant AI chat + escalation cap (UTC day). 0 = unlimited.
      AI_MAX_REQUESTS_PER_TENANT_PER_DAY: ${AI_MAX_REQUESTS_PER_TENANT_PER_DAY:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b-instruct-q4_K_M}
      VLLM_ENABLED: ${VLLM_ENABLED:-false}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-1024}
      PAID_LLM_PROVIDER: ${PAID_LLM_PROVIDER:-}
      PAID_LLM_API_KEY: ${PAID_LLM_API_KEY:-}
      PAID_LLM_MODEL: ${PAID_LLM_MODEL:-}
      PAID_LLM_BASE_URL: ${PAID_LLM_BASE_URL:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_REQUIRE_AUTH: ${MCP_REQUIRE_AUTH:-true}
      MCP_COMMIT_BYPASS: ${MCP_COMMIT_BYPASS:-false}
      MCP_HUMAN_APPROVAL_SECRET: ${MCP_HUMAN_APPROVAL_SECRET:-dev-local-mcp-approval-secret}
      AI_CONFIRMATION_TOKEN_PEPPER: ${AI_CONFIRMATION_TOKEN_PEPPER:-change-me-ai-token-pepper}
      # Email / SMTP (read from repo root .env)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-Prime7 ERP}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_API_BASE_URL: ${LEMONSQUEEZY_API_BASE_URL:-https://api.lemonsqueezy.com}
      LEMONSQUEEZY_CHECKOUT_SUCCESS_URL: ${LEMONSQUEEZY_CHECKOUT_SUCCESS_URL:-}
      # Scaling phase 1 (defaults off — enable after validation)
      PLATFORM_BULK_TENANT_ASYNC_ENABLED: ${PLATFORM_BULK_TENANT_ASYNC_ENABLED:-false}
      DATA_MIGRATION_ASYNC_ENABLED: ${DATA_MIGRATION_ASYNC_ENABLED:-false}
      API_CACHE_ENABLED: ${API_CACHE_ENABLED:-false}
      API_CACHE_TAX_CONFIG_TTL_SECONDS: ${API_CACHE_TAX_CONFIG_TTL_SECONDS:-300}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # Do not wait for ollama-init (model pull). That download can take many minutes and would
      # keep the API down, causing 502 from the frontend nginx proxy on /api/*. AI works after pull.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./backend:/app
    # Stable mode: avoid reload restarts (prevents intermittent 502s behind nginx).
    # Single worker on dev to reduce CPU contention with Ollama on low-spec hosts (4-core / 16GB RAM).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  worker:
    image: p7erp_local-backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://p7erp:p7erp@postgres:5432/p7erp
      USE_PGBOUNCER: ${USE_PGBOUNCER:-false}
      DATABASE_URL_PGBOUNCER: ${DATABASE_URL_PGBOUNCER:-postgresql://p7erp:p7erp@pgbouncer:5432/p7erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.common.celery_app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty = same-origin /api/* via container nginx (no browser CORS; 300s proxy timeouts).
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 1000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    restart: always
    ports:
      # Main app uses 5173; admin UI is at http://localhost:5174/admin/
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
