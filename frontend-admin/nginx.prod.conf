server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 301 /admin/;
  }

  location /admin/assets/ {
    # Vite outputs assets under /usr/share/nginx/html/assets,
    # while the app is served at /admin/.
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /admin/ {
    try_files $uri $uri/ /index.html;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /favicon.ico {
    return 204;
    access_log off;
    log_not_found off;
  }
}
