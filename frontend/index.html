<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="color-scheme" content="light" />
    <!-- p7:seo-head:start
         Replaced per page at build time by scripts/inject-static-route-html.ts (output of src/components/Seo.tsx).
         data-rh="true" lets react-helmet-async replace these tags instead of adding duplicates. -->
    <title>Prime7 ERP – AI-Powered Garments ERP Software</title>
    <meta name="description" content="Cloud ERP for garment manufacturers and buying houses: merchandising, costing, production, inventory, back-to-back LC, accounts and HR in one system." data-rh="true" />
    <meta name="robots" content="noindex, nofollow" data-rh="true" />
    <!-- p7:seo-head:end -->
    <!-- Inter is self-hosted (bundled from @fontsource-variable/inter in src/main.tsx). -->
    <!-- Apply theme before React to avoid flash of wrong colors (FOUC). External file so the
         Content-Security-Policy does not need 'unsafe-inline' for scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
