<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://prime7erp.com" />
    <!-- Brand: Prime7 ERP (must match src/config/seo.ts to avoid title/description flash before React hydrates) -->
    <meta name="description" content="Prime7 ERP – AI-powered cloud ERP for garment manufacturers and buying houses. Merchandising, production, inventory, LC management, accounting, and HR in one platform." />
    <title>Prime7 ERP – Cloud ERP for Garments & Buying Houses</title>
    <!-- Inter is self-hosted (bundled from @fontsource-variable/inter in src/main.tsx). -->
    <!-- Apply theme before React to avoid flash of wrong colors (FOUC). External file so the
         Content-Security-Policy does not need 'unsafe-inline' for scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
