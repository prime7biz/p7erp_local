server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  # Docker DNS (avoid stale upstream IPs when backend container is recreated).
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Compress text assets (JS/CSS/JSON/SVG). Responses that are already compressed are left alone.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # ---------------------------------------------------------------------------
  # Security headers (see docs/FRONTEND_SECURITY_HEADERS.md).
  #
  # Content-Security-Policy is shipped in REPORT-ONLY mode: the browser only logs violations
  # in DevTools → Console and blocks nothing. To enforce it, change the header name below from
  # "Content-Security-Policy-Report-Only" to "Content-Security-Policy" in ALL THREE places
  # (server block, /assets/, /index.html) after a clean week of no violations.
  #
  # connect-src: add your API origin here if VITE_API_BASE_URL points to another host.
  # cdn.jsdelivr.net serves the world map data on the dashboard.
  #
  # NOTE: nginx drops server-level add_header lines inside any location that has its own
  # add_header, so the same lines are repeated in /assets/ and /index.html below.
  # ---------------------------------------------------------------------------
  set $p7_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://prime7erp.com https://www.prime7erp.com https://api.prime7erp.com https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  set $p7_permissions "camera=(), microphone=(), geolocation=(), payment=(), usb=()";

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy $p7_permissions always;
  add_header Content-Security-Policy-Report-Only $p7_csp always;

  # After a new build, old hashed chunk names must not resolve to index.html (browser would see
  # "MIME type text/html" for .js). Only real files under /assets/; missing file => 404.
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Always revalidate shell HTML so new deploys pick up new chunk hashes (reduces stale-chunk errors).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Some API routes already send nosniff; keep only nginx's copy so the header is not doubled.
    proxy_hide_header X-Content-Type-Options;
  }

  location /media/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Content-Type-Options;
  }

  location / {
    # Avoid 301 canonical redirects (e.g. /login -> /login/) that can rewrite
    # host/port unexpectedly in local Docker access.
    try_files $uri /index.html;
  }
}
