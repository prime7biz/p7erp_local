server {
  listen 80;
  server_name _;

  # Docker DNS (avoid stale upstream IPs when backend container is recreated).
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # After a new build, old hashed chunk names must not resolve to index.html (browser would see
  # "MIME type text/html" for .js). Only real files under /assets/; missing file => 404.
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Always revalidate shell HTML so new deploys pick up new chunk hashes (reduces stale-chunk errors).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /media/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
