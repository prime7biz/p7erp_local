# www.prime7erp.com -> prime7erp.com for page requests (SEO: one host). Listed hosts only, so a forged
# Host header can never produce a redirect to another site. Empty (no redirect) for localhost and the apex.
# Relies on the host Nginx passing the visitor's Host header (proxy_set_header Host $host).
map $host $p7_apex_host {
  www.prime7erp.com prime7erp.com;
  default "";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  # Docker DNS (avoid stale upstream IPs when backend container is recreated).
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Redirects below send a relative Location (e.g. "/resources"). The browser keeps the public
  # https://prime7erp.com origin; nginx inside the container would otherwise build http://host:80/... URLs.
  absolute_redirect off;

  # Compress text assets (JS/CSS/JSON/SVG). Responses that are already compressed are left alone.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # ---------------------------------------------------------------------------
  # Security headers (see docs/FRONTEND_SECURITY_HEADERS.md).
  #
  # Content-Security-Policy is shipped in REPORT-ONLY mode: the browser only logs violations
  # in DevTools → Console and blocks nothing. To enforce it, change the header name below from
  # "Content-Security-Policy-Report-Only" to "Content-Security-Policy" in ALL THREE places
  # (server block, /assets/, /index.html) after a clean week of no violations.
  #
  # connect-src: add your API origin here if VITE_API_BASE_URL points to another host.
  # cdn.jsdelivr.net serves the world map data on the dashboard.
  #
  # NOTE: nginx drops server-level add_header lines inside any location that has its own
  # add_header, so the same lines are repeated in /assets/ and /index.html below.
  # ---------------------------------------------------------------------------
  # plausible.io: optional marketing analytics (VITE_PLAUSIBLE_DOMAIN, frontend/src/lib/analytics.ts).
  set $p7_csp "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://prime7erp.com https://www.prime7erp.com https://api.prime7erp.com https://cdn.jsdelivr.net https://plausible.io; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  # camera=(self): in-page webcam for employee photos (EmployeePhotoCapture); never for other origins.
  set $p7_permissions "camera=(self), microphone=(), geolocation=(), payment=(), usb=()";

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy $p7_permissions always;
  add_header Content-Security-Policy-Report-Only $p7_csp always;

  # After a new build, old hashed chunk names must not resolve to index.html (browser would see
  # "MIME type text/html" for .js). Only real files under /assets/; missing file => 404.
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Always revalidate shell HTML so new deploys pick up new chunk hashes (reduces stale-chunk errors).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Installed mobile app files: always fetched fresh so a deploy reaches phones on the next check
  # (docs/mobile-feasibility/AUTOMATIC-UPDATE-STRATEGY.md, section 3.1). Missing file => 404, never HTML.
  location ~ ^/(sw\.js|manifest\.webmanifest|version\.json|offline\.html)$ {
    try_files $uri =404;
    # nginx's mime.types has no .webmanifest entry; only that file falls back to this type.
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Android app file (mobile/android-twa/README.md). no-cache so Cloudflare and browsers re-check it and a
  # replaced APK is never served stale; always a download, never shown in the browser.
  location ^~ /downloads/ {
    try_files $uri =404;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Proves to Android that the Prime7 app and this site belong together. Must answer 200 JSON, no redirect.
  location = /.well-known/assetlinks.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # Page shells written next to index.html (e.g. /pricing/index.html): never cached, same as /index.html.
  location ~ \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }

  # ^~ on the proxies: the regex locations above (e.g. \.html$) must never take over backend paths.
  location ^~ /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Some API routes already send nosniff; keep only nginx's copy so the header is not doubled.
    proxy_hide_header X-Content-Type-Options;
  }

  # Platform status used by the app footer (backend route is /health, outside /api/).
  # Without this the SPA fallback below would answer with index.html.
  location = /health {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_hide_header X-Content-Type-Options;
    access_log off;
  }

  # ZKTeco attendance machines ("Cloud Server" / ADMS push) always call /iclock/* on the server.
  location ^~ /iclock/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    access_log off;
  }

  location ^~ /media/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Content-Type-Options;
  }

  # ---------------------------------------------------------------------------
  # Public pages (SEO). Each public page has its own HTML file written at build time
  # (frontend/scripts/inject-static-route-html.ts), e.g. /pricing -> /pricing/index.html, with its
  # title, canonical, Open Graph, JSON-LD and page body. Everything else (/app, /portal, login helpers,
  # unknown URLs) gets spa-fallback.html: same JavaScript app, but "noindex" in the raw HTML.
  # ---------------------------------------------------------------------------

  # Old URLs: permanent redirects so search engines move their signals to the real page.
  location = /blog { return 301 /resources; }
  location ^~ /blog/ {
    rewrite ^/blog/([^/]+)/?$ /resources/$1 permanent;
    return 301 /resources;
  }
  location = /privacy { return 301 /legal/privacy; }
  location = /terms { return 301 /legal/terms; }
  location = /legal { return 301 /legal/terms; }

  location / {
    # Pages only: /api/, /iclock/ (attendance devices), /media/ and /health keep answering on www, so
    # API calls and device pushes are never redirected. Visitors on www sign in again once on the main host.
    if ($p7_apex_host) {
      return 301 https://$p7_apex_host$request_uri;
    }
    # One URL per page: /pricing/ -> /pricing (query string kept). Only plain path characters, and the
    # first one may not be "/" or "\": "/\evil.com/" must never become "Location: /\evil.com" (open redirect).
    rewrite ^(/[A-Za-z0-9_-][A-Za-z0-9._~/-]*)/$ $1 permanent;
    try_files $uri @page_html;
  }

  # $uri/index.html is served here (not via redirect), so this block sets its own headers. nginx drops
  # server-level add_header lines in a location with its own add_header, hence the repeats.
  location @page_html {
    try_files $uri/index.html /spa-fallback.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy $p7_permissions always;
    add_header Content-Security-Policy-Report-Only $p7_csp always;
  }
}
