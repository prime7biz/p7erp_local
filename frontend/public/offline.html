<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#EA580C" />
    <title>Offline – Prime7 ERP</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1f2937; }
      main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { margin: 0 0 20px; max-width: 22rem; line-height: 1.5; color: #4b5563; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: 8px; background: #ea580c; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Prime7 ERP" />
      <h1>You are offline</h1>
      <p>Prime7 ERP needs an internet connection. Check Wi-Fi or mobile data, then try again. Nothing you saved is lost.</p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
