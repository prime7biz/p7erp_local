<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">AI with a human in the loop</title>
  <desc id="d">The AI reads ERP data you are allowed to see, prepares a suggestion, and a person reviews it. Only after a person confirms does anything get saved, sent or executed. Every step is written to the audit log.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #334155; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #64748b; }
    .w { fill: #ffffff; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="h" style="font-size:18px">AI suggests &#8212; a person decides</text>
  <text x="480" y="54" text-anchor="middle" class="s">Same pattern for the assistant, exception agents, AI Automation drafts and document autofill</text>

  <rect x="20" y="90" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <circle cx="44" cy="114" r="14" fill="#334155"/><text x="44" y="119" text-anchor="middle" class="b w" style="font-weight:700">1</text>
  <text x="66" y="119" class="h">You ask or open</text>
  <text x="34" y="146" class="b">&#8226; Question in the AI drawer</text>
  <text x="34" y="166" class="b">&#8226; Run agents / Ask a figure</text>
  <text x="34" y="186" class="b">&#8226; Upload a document</text>
  <text x="34" y="206" class="b">&#8226; Generate a brief</text>
  <text x="34" y="228" class="s">Only screens your role can open</text>

  <rect x="260" y="90" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="284" cy="114" r="14" fill="#0f766e"/><text x="284" y="119" text-anchor="middle" class="b w" style="font-weight:700">2</text>
  <text x="306" y="119" class="h">AI reads + drafts</text>
  <text x="274" y="146" class="b">&#8226; Reads your company's data</text>
  <text x="274" y="166" class="b">  (never other companies)</text>
  <text x="274" y="186" class="b">&#8226; Rules first, AI wording</text>
  <text x="274" y="206" class="b">&#8226; Shows source / confidence</text>
  <text x="274" y="228" class="s">Read-only at this point</text>

  <rect x="500" y="90" width="200" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <circle cx="524" cy="114" r="14" fill="#ea580c"/><text x="524" y="119" text-anchor="middle" class="b w" style="font-weight:700">3</text>
  <text x="546" y="119" class="h">A person reviews</text>
  <text x="514" y="146" class="b">&#8226; Read the suggestion</text>
  <text x="514" y="166" class="b">&#8226; Apply / Skip each field</text>
  <text x="514" y="186" class="b">&#8226; Add a note, or Dismiss</text>
  <text x="514" y="206" class="b">&#8226; Cancel at any time</text>
  <text x="514" y="228" class="s">Human checkpoint</text>

  <rect x="740" y="90" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="764" cy="114" r="14" fill="#0f766e"/><text x="764" y="119" text-anchor="middle" class="b w" style="font-weight:700">4</text>
  <text x="786" y="119" class="h">Confirm &#8594; action</text>
  <text x="754" y="146" class="b">&#8226; Confirm &amp; send</text>
  <text x="754" y="166" class="b">&#8226; Confirm and execute</text>
  <text x="754" y="186" class="b">&#8226; Approve Paid Processing</text>
  <text x="754" y="206" class="b">&#8226; Your normal Save button</text>
  <text x="754" y="228" class="s">Only now does anything change</text>

  <line x1="222" y1="165" x2="256" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="462" y1="165" x2="496" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="165" x2="736" y2="165" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrO)"/>

  <path d="M600,242 L600,290 L384,290" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="160" y="272" width="220" height="36" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="270" y="295" text-anchor="middle" class="b">Cancel / Dismiss &#8594; nothing changes</text>

  <rect x="20" y="330" width="920" height="44" rx="10" fill="#0f766e"/>
  <text x="480" y="357" text-anchor="middle" class="b w" style="font-size:13px;font-weight:600">AI audit log: every question, suggestion, confirm and dismiss is stored with who and when</text>

  <rect x="20" y="394" width="450" height="110" rx="12" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="40" y="420" class="h" style="fill:#0f766e">AI can</text>
  <text x="40" y="442" class="b">&#8226; Summarise figures, find late / risky items, draft text</text>
  <text x="40" y="462" class="b">&#8226; Read a document and suggest form values</text>
  <text x="40" y="482" class="b">&#8226; Point you to the record (Source / Open record link)</text>

  <rect x="490" y="394" width="450" height="110" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="510" y="420" class="h" style="fill:#ea580c">AI cannot</text>
  <text x="510" y="442" class="b">&#8226; Save, post, approve or delete records on its own</text>
  <text x="510" y="462" class="b">&#8226; See modules or records your role cannot open</text>
  <text x="510" y="482" class="b">&#8226; Guarantee it is right &#8212; always check the numbers</text>
</svg>
