<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Trade case stages and the documents each stage needs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f766e">Trade case stages (Move Stage)</text>
  <text x="24" y="56" font-size="13" fill="#334155">Orange tags = documents that must be uploaded on the case before you can move INTO that stage.</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="24" y="96" width="104" height="52" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="76" y="127" fill="#334155">DRAFT</text>

    <rect x="160" y="96" width="120" height="52" rx="10" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="220" y="127" fill="#0f766e">COMMERCIAL</text>

    <rect x="320" y="70" width="104" height="52" rx="10" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="372" y="101" fill="#0f766e">LC_OPEN</text>

    <rect x="460" y="96" width="110" height="52" rx="10" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="515" y="127" fill="#0f766e">BOOKING</text>

    <rect x="604" y="96" width="96" height="52" rx="10" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="652" y="127" fill="#0f766e">DOCS</text>

    <rect x="732" y="96" width="96" height="52" rx="10" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="780" y="127" fill="#0f766e">SHIPPED</text>

    <rect x="852" y="96" width="88" height="52" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
    <text x="896" y="127" fill="#ffffff">SETTLED</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="128" y1="122" x2="158" y2="122"/>
    <path d="M280 112 C 300 100, 300 96, 318 96"/>
    <path d="M424 96 C 444 96, 444 110, 458 114"/>
    <path d="M280 134 C 360 168, 400 160, 458 134"/>
    <line x1="570" y1="122" x2="602" y2="122"/>
    <line x1="700" y1="122" x2="730" y2="122"/>
    <line x1="828" y1="122" x2="850" y2="122"/>
  </g>
  <text x="372" y="176" font-size="11.5" fill="#334155" text-anchor="middle">LC_OPEN can be skipped (e.g. TT payment)</text>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="186" y="194" width="68" height="26" rx="13" fill="#fff7ed" stroke="#ea580c"/>
    <text x="220" y="212" fill="#ea580c">PI</text>
    <rect x="338" y="194" width="68" height="26" rx="13" fill="#fff7ed" stroke="#ea580c"/>
    <text x="372" y="212" fill="#ea580c">LC</text>
    <rect x="450" y="194" width="130" height="26" rx="13" fill="#fff7ed" stroke="#ea580c"/>
    <text x="515" y="212" fill="#ea580c">BOOKING_CONFIRM</text>
    <rect x="596" y="194" width="112" height="26" rx="13" fill="#fff7ed" stroke="#ea580c"/>
    <text x="652" y="212" fill="#ea580c">BL + INVOICE</text>
    <rect x="596" y="226" width="112" height="26" rx="13" fill="#fff7ed" stroke="#ea580c"/>
    <text x="652" y="244" fill="#ea580c">PACKING_LIST</text>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="76" y="212">no documents</text>
    <text x="780" y="212">no documents</text>
    <text x="896" y="212">closes the case</text>
  </g>

  <rect x="24" y="270" width="912" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="40" y="297" font-size="12.5" fill="#334155">If a document is missing the page shows <tspan font-weight="700">"Missing docs for ..."</tspan> and Move Stage is refused with <tspan font-weight="700">"Missing required documents for ..."</tspan>. Upload it first.</text>
</svg>
