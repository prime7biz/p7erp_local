<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>UD, bond register and Mushak VAT registers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f766e">Bond &amp; VAT registers &#8212; what feeds what</text>
  <text x="24" y="56" font-size="13" fill="#334155">Working registers only. Exports are spreadsheets, not the official e-UD / CBMS / NBR files.</text>

  <text x="24" y="90" font-size="14" font-weight="700" fill="#334155">Bond side (you type these)</text>
  <g font-size="12.5">
    <rect x="24" y="102" width="200" height="86" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="40" y="126" font-weight="700" fill="#0f766e">UD (New UD)</text>
    <text x="40" y="146" fill="#334155">UD no., issuer, export LC,</text>
    <text x="40" y="164" fill="#334155">permitted imports + qty</text>
    <text x="40" y="180" fill="#334155" font-size="11.5">DRAFT &#8594; APPROVED &#8594; CLOSED</text>

    <rect x="264" y="102" width="200" height="86" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="280" y="126" font-weight="700" fill="#0f766e">Import into bond</text>
    <text x="280" y="146" fill="#334155">Fabric / trims received</text>
    <text x="280" y="164" fill="#334155">(bill of entry, invoice)</text>

    <rect x="504" y="102" width="200" height="86" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <text x="520" y="126" font-weight="700" fill="#0f766e">Consumed / exported</text>
    <text x="520" y="146" fill="#334155">Material used in the</text>
    <text x="520" y="164" fill="#334155">garments you shipped</text>

    <rect x="744" y="102" width="192" height="86" rx="12" fill="#0f766e"/>
    <text x="760" y="126" font-weight="700" fill="#ffffff">Utilization + Bond register</text>
    <text x="760" y="146" fill="#ffffff">In bond, remaining</text>
    <text x="760" y="164" fill="#ffffff">entitlement, % used</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="224" y1="145" x2="262" y2="145"/>
    <line x1="464" y1="145" x2="502" y2="145"/>
    <line x1="704" y1="145" x2="742" y2="145"/>
  </g>

  <text x="24" y="226" font-size="14" font-weight="700" fill="#334155">VAT side (built automatically from your records)</text>
  <g font-size="12.5">
    <rect x="24" y="238" width="220" height="56" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="40" y="261" font-weight="700" fill="#ea580c">Vendor bills (Finance)</text>
    <text x="40" y="281" fill="#334155">&#8594; Mushak 6.1 (purchases)</text>

    <rect x="24" y="304" width="220" height="56" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="40" y="327" font-weight="700" fill="#ea580c">Commercial invoices</text>
    <text x="40" y="347" fill="#334155">&#8594; Mushak 6.2 (sales) + 6.3</text>

    <rect x="384" y="238" width="300" height="56" rx="12" fill="#f1f5f9" stroke="#334155"/>
    <text x="400" y="261" font-weight="700" fill="#334155">Mushak 6.10 (&gt; 2 lakh)</text>
    <text x="400" y="281" fill="#334155">Items above BDT 2,00,000 in the month</text>

    <rect x="384" y="304" width="552" height="56" rx="12" fill="#0f766e"/>
    <text x="400" y="327" font-weight="700" fill="#ffffff">Mushak 9.1 (draft return) &#8212; built from 6.1 + 6.2</text>
    <text x="400" y="347" fill="#ffffff">Output VAT &#8722; input VAT = net VAT payable, or credit to carry forward (due by the 15th)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M244 262 L 382 262"/>
    <path d="M244 280 C 310 290, 320 318, 382 324"/>
    <path d="M244 322 C 310 312, 320 286, 382 278"/>
    <path d="M244 342 L 382 342"/>
  </g>
</svg>
