<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Where each voucher lands: voucher to ledgers to Trial Balance to Profit and Loss and Balance Sheet</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">Where each voucher lands</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#334155">Example: pay the electricity bill of 5,000 from the bank. Only POSTED vouchers reach the reports.</text>

  <!-- Voucher -->
  <rect x="20" y="80" width="230" height="170" rx="14" fill="#0f766e"/>
  <text x="135" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Payment voucher (POSTED)</text>
  <line x1="36" y1="118" x2="234" y2="118" stroke="#5eead4" stroke-width="1"/>
  <text x="36" y="142" font-size="12" fill="#ffffff">Dr  Electricity Expense</text>
  <text x="234" y="142" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">5,000</text>
  <text x="36" y="166" font-size="12" fill="#ffffff">Cr  Bank &#8211; Current A/C</text>
  <text x="234" y="166" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">5,000</text>
  <line x1="36" y1="180" x2="234" y2="180" stroke="#5eead4" stroke-width="1"/>
  <text x="135" y="202" text-anchor="middle" font-size="12" fill="#ccfbf1">Debit total = Credit total</text>
  <text x="135" y="222" text-anchor="middle" font-size="12" fill="#ccfbf1">(a voucher must balance)</text>

  <!-- Ledgers -->
  <rect x="290" y="80" width="230" height="78" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
  <text x="405" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">2a. Electricity Expense ledger</text>
  <text x="405" y="126" text-anchor="middle" font-size="12" fill="#334155">+5,000 debit</text>
  <text x="405" y="145" text-anchor="middle" font-size="11" fill="#334155">(expense goes up)</text>
  <rect x="290" y="172" width="230" height="78" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
  <text x="405" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">2b. Bank ledger</text>
  <text x="405" y="218" text-anchor="middle" font-size="12" fill="#334155">5,000 credit</text>
  <text x="405" y="237" text-anchor="middle" font-size="11" fill="#334155">(money in bank goes down)</text>

  <line x1="252" y1="140" x2="286" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="252" y1="190" x2="286" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- TB -->
  <rect x="560" y="80" width="170" height="170" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="645" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">3. Trial Balance</text>
  <text x="645" y="132" text-anchor="middle" font-size="12" fill="#334155">One row per ledger:</text>
  <text x="645" y="152" text-anchor="middle" font-size="12" fill="#334155">balance in Debit</text>
  <text x="645" y="170" text-anchor="middle" font-size="12" fill="#334155">or Credit column</text>
  <text x="645" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Total Debit</text>
  <text x="645" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">= Total Credit</text>

  <line x1="522" y1="120" x2="556" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="522" y1="210" x2="556" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- P&L -->
  <rect x="770" y="80" width="170" height="78" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="855" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">4a. Profit &amp; Loss</text>
  <text x="855" y="124" text-anchor="middle" font-size="12" fill="#334155">Income &amp; Expense</text>
  <text x="855" y="143" text-anchor="middle" font-size="12" fill="#334155">Expense +5,000</text>
  <rect x="770" y="172" width="170" height="78" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="855" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">4b. Balance Sheet</text>
  <text x="855" y="216" text-anchor="middle" font-size="12" fill="#334155">Assets, Liabilities, Equity</text>
  <text x="855" y="235" text-anchor="middle" font-size="12" fill="#334155">Assets (bank) &#8722;5,000</text>

  <line x1="732" y1="150" x2="766" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="732" y1="180" x2="766" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Rules -->
  <rect x="20" y="290" width="440" height="200" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
  <text x="40" y="318" font-size="14" font-weight="700" fill="#334155">Which report shows which nature</text>
  <text x="40" y="346" font-size="12" fill="#334155">Account Group "nature" decides where a ledger lands:</text>
  <text x="56" y="372" font-size="12" fill="#334155">&#8226; Income, Expense  &#8594;  Profit &amp; Loss</text>
  <text x="56" y="396" font-size="12" fill="#334155">&#8226; Asset, Liability, Equity  &#8594;  Balance Sheet</text>
  <text x="56" y="420" font-size="12" fill="#334155">&#8226; Every nature  &#8594;  Trial Balance</text>
  <text x="40" y="452" font-size="12" fill="#334155">Net Profit (Income &#8722; Expense) belongs to the owners, so:</text>
  <text x="40" y="472" font-size="12" font-weight="700" fill="#0f766e">Assets = Liabilities + Equity + Profit</text>

  <rect x="500" y="290" width="440" height="200" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="318" font-size="14" font-weight="700" fill="#ea580c">What does NOT reach the reports</text>
  <text x="536" y="346" font-size="12" fill="#334155">&#8226; Vouchers still in DRAFT, SUBMITTED, CHECKED,</text>
  <text x="536" y="366" font-size="12" fill="#334155">   RECOMMENDED or APPROVED (not yet posted)</text>
  <text x="536" y="390" font-size="12" fill="#334155">&#8226; Rejected or cancelled vouchers</text>
  <text x="536" y="414" font-size="12" fill="#334155">&#8226; Memorandum vouchers and future post-dated vouchers</text>
  <text x="536" y="438" font-size="12" fill="#334155">&#8226; Stock transfer vouchers (quantity only)</text>
  <text x="520" y="472" font-size="12" font-weight="600" fill="#334155">Day Book lists vouchers of every status &#8212; check its Status column.</text>
</svg>
