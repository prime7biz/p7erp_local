<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Voucher lifecycle (status on the Vouchers list)</text>
  <text x="24" y="56" font-size="12" fill="#475569">Each arrow is a button in Actions (list / approval queue) or on the voucher page. Only the next allowed step is shown.</text>

  <!-- Main path -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="24" y="110" width="118" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="83" y="135" fill="#0f172a">DRAFT</text>
    <text x="83" y="152" font-size="11" font-weight="400" fill="#475569">Save Draft</text>

    <rect x="178" y="110" width="118" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="237" y="135" fill="#0f172a">SUBMITTED</text>
    <text x="237" y="152" font-size="11" font-weight="400" fill="#475569">in approval queue</text>

    <rect x="332" y="110" width="118" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="391" y="135" fill="#0f172a">CHECKED</text>
    <text x="391" y="152" font-size="11" font-weight="400" fill="#475569">manager / admin</text>

    <rect x="486" y="110" width="128" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="550" y="135" fill="#0f172a">RECOMMENDED</text>
    <text x="550" y="152" font-size="11" font-weight="400" fill="#475569">manager / admin</text>

    <rect x="650" y="110" width="118" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="709" y="135" fill="#0f172a">APPROVED</text>
    <text x="709" y="152" font-size="11" font-weight="400" fill="#475569">ready to post</text>

    <rect x="804" y="110" width="132" height="54" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
    <text x="870" y="135" fill="#ffffff">POSTED</text>
    <text x="870" y="152" font-size="11" font-weight="400" fill="#ccfbf1">in ledgers &amp; reports</text>
  </g>

  <!-- Main arrows with action labels -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="142" y1="137" x2="176" y2="137"/>
    <line x1="296" y1="137" x2="330" y2="137"/>
    <line x1="450" y1="137" x2="484" y2="137"/>
    <line x1="614" y1="137" x2="648" y2="137"/>
    <line x1="768" y1="137" x2="802" y2="137"/>
  </g>
  <g font-size="11" fill="#0f766e" font-weight="700" text-anchor="middle">
    <text x="159" y="100">Submit</text>
    <text x="313" y="100">Check</text>
    <text x="467" y="100">Recommend</text>
    <text x="631" y="100">Approve</text>
    <text x="785" y="100">Post</text>
  </g>

  <!-- Reject branch -->
  <rect x="380" y="250" width="160" height="54" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="460" y="275" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">REJECTED</text>
  <text x="460" y="292" font-size="11" fill="#7f1d1d" text-anchor="middle">reason required</text>
  <g stroke="#b91c1c" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)">
    <path d="M237,164 C237,220 380,240 400,250"/>
    <path d="M391,164 L430,248"/>
    <path d="M550,164 L490,248"/>
    <path d="M709,164 C709,220 540,240 520,250"/>
  </g>
  <text x="640" y="232" font-size="11" fill="#b91c1c" font-weight="700">Reject (from any approval step)</text>

  <!-- Set draft back -->
  <g stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M380,277 C200,277 90,240 83,166"/>
  </g>
  <text x="120" y="318" font-size="11" fill="#334155" font-weight="700">Set Draft &#8594; fix and resubmit</text>

  <!-- Cancel from draft -->
  <rect x="24" y="330" width="118" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="83" y="352" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">CANCELLED</text>
  <text x="83" y="368" font-size="11" fill="#475569" text-anchor="middle">draft never used</text>
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M60,164 L60,328"/>
  </g>
  <text x="66" y="300" font-size="11" fill="#475569" font-weight="700">Cancel</text>

  <!-- Posted outcomes -->
  <rect x="804" y="250" width="132" height="54" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="870" y="275" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">REVERSED</text>
  <text x="870" y="292" font-size="11" fill="#7c2d12" text-anchor="middle">+ mirror voucher today</text>
  <g stroke="#ea580c" stroke-width="1.4" fill="none" marker-end="url(#arrowOrange)">
    <line x1="870" y1="164" x2="870" y2="248"/>
  </g>
  <text x="876" y="212" font-size="11" fill="#ea580c" font-weight="700">Reverse</text>

  <g stroke="#ea580c" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowOrange)">
    <path d="M820,164 C800,200 740,200 725,166"/>
  </g>
  <text x="800" y="212" font-size="11" fill="#ea580c" font-weight="700" text-anchor="end">Cancel posting &#8594; APPROVED</text>

  <!-- Legend / notes -->
  <rect x="380" y="330" width="556" height="108" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="396" y="354" font-size="12" font-weight="700" fill="#0f172a">Good to know</text>
  <text x="396" y="374" font-size="12" fill="#334155">&#8226; Save &amp; Submit jumps from new straight to SUBMITTED.</text>
  <text x="396" y="393" font-size="12" fill="#334155">&#8226; Direct posting (Save &amp; Post / Post now) runs every step in one click; History still lists each.</text>
  <text x="396" y="412" font-size="12" fill="#334155">&#8226; Check, Recommend, Approve, Post, Reject, Reverse, Cancel posting: manager or admin only.</text>
  <text x="396" y="431" font-size="12" fill="#334155">&#8226; Post / Cancel posting need an open accounting period for the voucher date.</text>
</svg>
