<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
  <text x="24" y="30" font-size="20" font-weight="700" fill="#334155">Map of the Prime7 ERP screen</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Every page uses the same frame. Find the number on the picture, then read what it does on the right.</text>

  <!-- ===== Simplified app frame ===== -->
  <rect x="24" y="92" width="596" height="440" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Sidebar -->
