  <text x="460" y="230" font-size="9" font-weight="700" fill="#64748b">STATUS</text>
  <text x="560" y="230" font-size="9" font-weight="700" fill="#64748b">ACTIONS</text>
  <g font-size="9" fill="#334155">
    <rect x="198" y="243" width="9" height="9" rx="2" fill="#fff" stroke="#94a3b8"/>
    <text x="214" y="251">LKH-C-01</text><text x="290" y="251">Buyer One Ltd</text><text x="460" y="251">Active</text>
    <rect x="198" y="267" width="9" height="9" rx="2" fill="#fff" stroke="#94a3b8"/>
    <text x="214" y="275">LKH-C-02</text><text x="290" y="275">Buyer Two Ltd</text><text x="460" y="275">Active</text>
    <rect x="198" y="291" width="9" height="9" rx="2" fill="#fff" stroke="#94a3b8"/>
    <text x="214" y="299">LKH-C-03</text><text x="290" y="299">Buyer Three</text><text x="460" y="299">Inactive</text>
  </g>
  <rect x="552" y="241" width="46" height="14" rx="4" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="575" y="251" font-size="8" fill="#334155" text-anchor="middle">Actions</text>
  <rect x="552" y="265" width="46" height="14" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="575" y="275" font-size="8" fill="#334155" text-anchor="middle">Actions</text>
  <rect x="552" y="289" width="46" height="14" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="575" y="299" font-size="8" fill="#334155" text-anchor="middle">Actions</text>
  <!-- open menu -->
  <rect x="520" y="258" width="78" height="74" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="530" y="273" font-size="9" fill="#334155">View</text>
  <text x="530" y="289" font-size="9" fill="#334155">Edit</text>
  <text x="530" y="305" font-size="9" fill="#334155">Print</text>
  <text x="530" y="321" font-size="9" fill="#dc2626">Delete</text>
  <!-- pagination -->
  <text x="198" y="356" font-size="9" fill="#64748b">Showing 1 to 20 of 54 &#183; Per page 20</text>
  <text x="520" y="356" font-size="9" fill="#64748b">Previous 1 2 3 Next</text>
  <rect x="190" y="372" width="418" height="116" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="399" y="434" font-size="11" fill="#94a3b8" text-anchor="middle">Page content (forms, tabs, details)</text>

  <!-- Footer -->
  <line x1="174" y1="500" x2="620" y2="500" stroke="#cbd5e1"/>
  <text x="184" y="520" font-size="9" fill="#64748b">Prime7 ERP &#183; date time &#183; System: healthy &#183; Version</text>

  <!-- ===== Callout markers ===== -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="160" cy="110" r="9" fill="#0f766e"/><text x="160" y="114">1</text>
    <circle cx="160" cy="148" r="9" fill="#0f766e"/><text x="160" y="152">2</text>
    <circle cx="160" cy="196" r="9" fill="#0f766e"/><text x="160" y="200">3</text>
