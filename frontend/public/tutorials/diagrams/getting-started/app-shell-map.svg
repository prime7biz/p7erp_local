  <rect x="36" y="102" width="70" height="16" rx="3" fill="#ea580c"/>
  <text x="71" y="114" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PRIME7 ERP</text>
  <text x="150" y="115" font-size="13" fill="#64748b">&#8249;</text>
  <line x1="24" y1="126" x2="174" y2="126" stroke="#cbd5e1"/>
  <circle cx="44" cy="146" r="10" fill="#ccfbf1"/><text x="44" y="150" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">T</text>
  <text x="60" y="142" font-size="10" font-weight="700" fill="#334155">Your name</text>
  <text x="60" y="155" font-size="9" fill="#64748b">Company &#183; Code</text>
  <line x1="24" y1="168" x2="174" y2="168" stroke="#cbd5e1"/>
  <text x="36" y="184" font-size="9" font-weight="700" fill="#64748b">&#9733; FAVORITES / RECENTS</text>
  <rect x="36" y="190" width="100" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="36" y="204" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <line x1="24" y1="222" x2="174" y2="222" stroke="#cbd5e1"/>
  <rect x="30" y="230" width="4" height="16" rx="2" fill="#ea580c"/>
  <text x="40" y="242" font-size="11" font-weight="600" fill="#ea580c">Dashboard</text>
  <text x="40" y="266" font-size="11" fill="#334155">Support</text>
  <text x="40" y="290" font-size="11" fill="#334155">Merchandising</text>
  <text x="40" y="314" font-size="11" fill="#334155">Export &amp; Import</text>
  <text x="40" y="338" font-size="11" fill="#334155">Inventory</text>
  <text x="40" y="362" font-size="11" fill="#334155">Manufacturing</text>
  <text x="40" y="386" font-size="11" fill="#334155">HR</text>
  <text x="40" y="410" font-size="11" fill="#334155">Finance</text>
  <text x="40" y="434" font-size="11" fill="#334155">Workflow</text>
  <text x="40" y="458" font-size="11" fill="#334155">Reports &#183; Settings</text>
  <line x1="24" y1="500" x2="174" y2="500" stroke="#cbd5e1"/>
  <rect x="40" y="510" width="10" height="12" rx="1.5" fill="none" stroke="#334155" stroke-width="1.3"/>
  <text x="56" y="520" font-size="11" fill="#334155">Help &amp; Tutorials</text>

  <!-- Header -->
  <line x1="174" y1="126" x2="620" y2="126" stroke="#cbd5e1"/>
  <rect x="184" y="99" width="158" height="20" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="194" cy="108" r="3.5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="196.5" y1="110.5" x2="199" y2="113" stroke="#64748b" stroke-width="1.2"/>
  <text x="204" y="113" font-size="9" fill="#64748b">Search pages, orders&#8230;</text>
  <rect x="312" y="103" width="26" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <text x="325" y="112" font-size="7" fill="#64748b" text-anchor="middle">Ctrl+K</text>
  <rect x="354" y="99" width="44" height="20" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="376" y="113" font-size="10" fill="#334155" text-anchor="middle">+ New</text>
  <rect x="404" y="99" width="54" height="20" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="431" y="113" font-size="10" fill="#334155" text-anchor="middle">Portals</text>
  <text x="474" y="114" font-size="12" fill="#334155" text-anchor="middle">&#10022;</text>
  <rect x="488" y="103" width="16" height="12" rx="2" fill="#fff" stroke="#334155"/>
  <circle cx="524" cy="109" r="7" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="530" cy="102" r="5" fill="#ef4444"/>
  <circle cx="552" cy="109" r="8" fill="#ccfbf1"/><text x="552" y="113" font-size="9" font-weight="700" fill="#0f766e" text-anchor="middle">T</text>
  <text x="564" y="113" font-size="9" fill="#334155">Name &#9662;</text>

  <!-- Breadcrumbs -->
  <rect x="174" y="126" width="446" height="20" fill="#f8fafc"/>
  <text x="184" y="140" font-size="9" fill="#64748b">Home &#8250; Merchandising &#8250; Customers</text>
  <line x1="174" y1="146" x2="620" y2="146" stroke="#e2e8f0"/>

  <!-- Main page -->
  <text x="190" y="170" font-size="14" font-weight="700" fill="#334155">Customers</text>
  <rect x="540" y="157" width="68" height="20" rx="5" fill="#ea580c"/>
  <text x="574" y="171" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">+ New</text>
  <!-- toolbar -->
  <rect x="190" y="186" width="418" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="362" y="191" width="40" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="382" y="202" font-size="8" fill="#334155" text-anchor="middle">Views</text>
  <rect x="406" y="191" width="50" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="431" y="202" font-size="8" fill="#334155" text-anchor="middle">Columns</text>
  <rect x="460" y="191" width="54" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="487" y="202" font-size="8" fill="#334155" text-anchor="middle">Compact</text>
  <rect x="518" y="191" width="44" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="540" y="202" font-size="8" fill="#334155" text-anchor="middle">Export</text>
  <!-- table -->
  <rect x="190" y="216" width="418" height="20" fill="#f1f5f9"/>
  <text x="214" y="230" font-size="9" font-weight="700" fill="#64748b">CODE</text>
