    <circle cx="160" cy="516" r="9" fill="#0f766e"/><text x="160" y="520">5</text>
    <circle cx="262" cy="80" r="9" fill="#ea580c"/><text x="262" y="84">6</text>
    <circle cx="376" cy="80" r="9" fill="#ea580c"/><text x="376" y="84">7</text>
    <circle cx="431" cy="80" r="9" fill="#ea580c"/><text x="431" y="84">8</text>
    <circle cx="474" cy="80" r="9" fill="#ea580c"/><text x="474" y="84">9</text>
    <circle cx="498" cy="80" r="9" fill="#ea580c"/><text x="498" y="84">10</text>
    <circle cx="524" cy="80" r="9" fill="#ea580c"/><text x="524" y="84">11</text>
    <circle cx="580" cy="80" r="9" fill="#ea580c"/><text x="580" y="84">12</text>
    <circle cx="372" cy="136" r="9" fill="#334155"/><text x="372" y="140">13</text>
    <circle cx="344" cy="199" r="9" fill="#334155"/><text x="344" y="203">14</text>
    <circle cx="606" cy="232" r="9" fill="#334155"/><text x="606" y="236">15</text>
    <circle cx="420" cy="516" r="9" fill="#334155"/><text x="420" y="520">16</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="262" y1="89" x2="262" y2="99"/>
    <line x1="376" y1="89" x2="376" y2="99"/>
    <line x1="431" y1="89" x2="431" y2="99"/>
    <line x1="474" y1="89" x2="474" y2="102"/>
    <line x1="498" y1="89" x2="497" y2="103"/>
    <line x1="524" y1="89" x2="524" y2="101"/>
    <line x1="580" y1="89" x2="575" y2="102"/>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="640" y="72" width="296" height="460" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g font-size="12" fill="#334155">
    <text x="656" y="96" font-size="12" font-weight="700" fill="#0f766e">Left sidebar</text>
    <text x="656" y="116"><tspan font-weight="700">1</tspan>  Logo (home) and &#8249; collapse to icons</text>
    <text x="656" y="135"><tspan font-weight="700">2</tspan>  You, your company and company code</text>
    <text x="656" y="154"><tspan font-weight="700">3</tspan>  Favorites (&#9733; from search)</text>
    <text x="656" y="173"><tspan font-weight="700">4</tspan>  Modules &#8212; click one to open its pages</text>
    <text x="656" y="192"><tspan font-weight="700">5</tspan>  Help &amp; Tutorials (these guides)</text>

    <text x="656" y="220" font-size="12" font-weight="700" fill="#ea580c">Top bar</text>
    <text x="656" y="240"><tspan font-weight="700">6</tspan>  Search pages and records (Ctrl+K or /)</text>
    <text x="656" y="259"><tspan font-weight="700">7</tspan>  + New: create inquiry, order, PO, voucher&#8230;</text>
    <text x="656" y="278"><tspan font-weight="700">8</tspan>  Portals: customer / financier sign-in links</text>
    <text x="656" y="297"><tspan font-weight="700">9</tspan>  &#10022; Prime7 AI assistant panel</text>
    <text x="656" y="316"><tspan font-weight="700">10</tspan>  Keyboard shortcuts list (or press ?)</text>
    <text x="656" y="335"><tspan font-weight="700">11</tspan>  Bell: work waiting + your notifications</text>
    <text x="656" y="354"><tspan font-weight="700">12</tspan>  Your menu: My Profile, My Signature,</text>
    <text x="680" y="371">Settings, Dark mode, Logout</text>

    <text x="656" y="399" font-size="12" font-weight="700" fill="#334155">Page area</text>
    <text x="656" y="419"><tspan font-weight="700">13</tspan>  Breadcrumbs: where you are now</text>
    <text x="656" y="438"><tspan font-weight="700">14</tspan>  List toolbar: Views, Columns, Export</text>
    <text x="656" y="457"><tspan font-weight="700">15</tspan>  One Actions button per row</text>
    <text x="680" y="474">(View, Edit, Print, Delete&#8230;)</text>
    <text x="656" y="493"><tspan font-weight="700">16</tspan>  Status footer: date, time, version</text>
    <text x="656" y="516" font-size="11" fill="#64748b">On phones: bottom bar + round + button</text>
  </g>

  <text x="24" y="558" font-size="11" fill="#64748b">Simplified drawing. Your menus can differ: they depend on company type, switched-on features and your role.</text>
</svg>
