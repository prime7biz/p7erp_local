<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#334155">One user, one active device</text>
  <text x="24" y="56" font-size="13" fill="#64748b">The newest sign-in wins. The older screen is signed out the next time it talks to the server.</text>

  <!-- Step 1 -->
  <rect x="24" y="84" width="208" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
  <circle cx="46" cy="106" r="13" fill="#0f766e"/><text x="46" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="111" font-size="14" font-weight="700" fill="#334155">Office PC</text>
  <text x="38" y="138" font-size="12" fill="#334155">You are signed in and</text>
  <text x="38" y="156" font-size="12" fill="#334155">working on an order.</text>
  <rect x="38" y="172" width="180" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="128" y="200" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">Active</text>
  <line x1="232" y1="160" x2="260" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="264" y="84" width="208" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
  <circle cx="286" cy="106" r="13" fill="#0f766e"/><text x="286" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="306" y="111" font-size="14" font-weight="700" fill="#334155">Phone / other PC</text>
  <text x="278" y="138" font-size="12" fill="#334155">The SAME account signs</text>
  <text x="278" y="156" font-size="12" fill="#334155">in somewhere else.</text>
  <rect x="278" y="172" width="180" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="368" y="200" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">New session = Active</text>
  <line x1="472" y1="160" x2="500" y2="160" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Step 3 -->
  <rect x="504" y="84" width="208" height="150" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <circle cx="526" cy="106" r="13" fill="#ea580c"/><text x="526" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="546" y="111" font-size="14" font-weight="700" fill="#334155">Office PC again</text>
  <text x="518" y="138" font-size="12" fill="#334155">Next click goes to the</text>
  <text x="518" y="156" font-size="12" fill="#334155">sign-in page with a note:</text>
  <rect x="518" y="168" width="180" height="54" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="528" y="186" font-size="10.5" fill="#334155">You were logged out because</text>
  <text x="528" y="200" font-size="10.5" fill="#334155">this account signed in on</text>
  <text x="528" y="214" font-size="10.5" fill="#334155">another device.</text>
  <line x1="712" y1="160" x2="740" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="744" y="84" width="192" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
  <circle cx="766" cy="106" r="13" fill="#0f766e"/><text x="766" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="786" y="111" font-size="14" font-weight="700" fill="#334155">Sign in again</text>
  <text x="758" y="138" font-size="12" fill="#334155">You return to the same</text>
  <text x="758" y="156" font-size="12" fill="#334155">page you were on. The</text>
  <text x="758" y="174" font-size="12" fill="#334155">phone is now signed out.</text>
  <text x="758" y="208" font-size="12" fill="#0f766e" font-weight="600">Unsaved typing is lost</text>

  <!-- Advice -->
  <rect x="24" y="256" width="912" height="88" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="280" font-size="13" font-weight="700" fill="#0f766e">What to do</text>
  <text x="40" y="302" font-size="12" fill="#334155">&#8226; Never share one login between two people. Ask your admin for your own user (Settings &#8594; User Mgmt).</text>
  <text x="40" y="322" font-size="12" fill="#334155">&#8226; Saw the message but did not sign in elsewhere? Change your password (Forgot password?) and tell your admin at once.</text>
  <text x="40" y="340" font-size="12" fill="#64748b">&#8220;Your session expired&#8221; is different: you were idle too long. Just sign in again.</text>
</svg>
