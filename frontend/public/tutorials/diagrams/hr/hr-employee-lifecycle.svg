<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="590" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Employee lifecycle in P7 ERP</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">Hire &#8594; onboard &#8594; attendance &amp; leave &#8594; payroll &#8594; exit. Each box names the HR screen to open.</text>

  <!-- Row 1 -->
  <rect x="20" y="78" width="280" height="196" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <circle cx="44" cy="104" r="14" fill="#334155"/><text x="44" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="66" y="109" font-size="15" font-weight="700" fill="#334155">Recruit</text>
  <text x="36" y="140" font-size="13" fill="#334155">Talent &#8594; Job Requisitions</text>
  <text x="36" y="162" font-size="13" fill="#334155">&#8594; Candidates &#8594; Interviews</text>
  <text x="36" y="184" font-size="13" fill="#334155">&#8594; Offers</text>
  <text x="36" y="222" font-size="12" fill="#64748b">Optional. Small factories can</text>
  <text x="36" y="239" font-size="12" fill="#64748b">start directly at step 2.</text>

  <rect x="340" y="78" width="280" height="196" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="364" cy="104" r="14" fill="#0f766e"/><text x="364" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="386" y="109" font-size="15" font-weight="700" fill="#0f766e">Hire &amp; onboard</text>
  <text x="356" y="140" font-size="13" fill="#334155">Core HR &#8594; Employees &#8594; Add employee</text>
  <text x="356" y="162" font-size="13" fill="#334155">(or AI Onboarding from CV / NID)</text>
  <text x="356" y="184" font-size="13" fill="#334155">Fill Personal, Job, Documents tabs</text>
  <text x="356" y="206" font-size="13" fill="#334155">Link the login (Linked app user)</text>
  <text x="356" y="228" font-size="13" fill="#334155">Generate document &#8594; ID card,</text>
  <text x="356" y="250" font-size="13" fill="#334155">Appointment letter</text>

  <rect x="660" y="78" width="280" height="196" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="684" cy="104" r="14" fill="#0f766e"/><text x="684" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="706" y="109" font-size="15" font-weight="700" fill="#0f766e">Daily attendance</text>
  <text x="676" y="140" font-size="13" fill="#334155">Time &amp; Attendance &#8594; Roster (shift)</text>
  <text x="676" y="162" font-size="13" fill="#334155">Daily Entry (manual / biometric)</text>
  <text x="676" y="184" font-size="13" fill="#334155">Regularizations (fix punches)</text>
  <text x="676" y="206" font-size="13" fill="#334155">Overtime &#8594; Approve</text>
  <text x="676" y="228" font-size="13" fill="#334155">Summary (present / absent / late)</text>
  <text x="676" y="250" font-size="12" fill="#64748b">Employee sees: My Attendance</text>

  <!-- Row 2 -->
  <rect x="20" y="330" width="280" height="196" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="44" cy="356" r="14" fill="#0f766e"/><text x="44" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="66" y="361" font-size="15" font-weight="700" fill="#0f766e">Leave</text>
  <text x="36" y="392" font-size="13" fill="#334155">Employee: Self-Service &#8594; My Leave</text>
  <text x="36" y="414" font-size="13" fill="#334155">or HR: Leave &#8594; Requests</text>
  <text x="36" y="436" font-size="13" fill="#334155">Manager: Leave &#8594; Approvals</text>
  <text x="36" y="458" font-size="13" fill="#334155">Check Leave &#8594; Balances, Calendar</text>
  <text x="36" y="496" font-size="12" fill="#64748b">Approved leave is counted by payroll</text>
  <text x="36" y="513" font-size="12" fill="#64748b">as paid or unpaid leave days.</text>

  <rect x="340" y="330" width="280" height="196" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="364" cy="356" r="14" fill="#ea580c"/><text x="364" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
  <text x="386" y="361" font-size="15" font-weight="700" fill="#c2410c">Monthly payroll</text>
  <text x="356" y="392" font-size="13" fill="#334155">Payroll &#8594; Structure Assignments</text>
  <text x="356" y="414" font-size="13" fill="#334155">Periods &#8594; Runs &#8594; Approvals</text>
  <text x="356" y="436" font-size="13" fill="#334155">Payslips (PDF)</text>
  <text x="356" y="458" font-size="13" fill="#334155">Employee sees: My Payslips</text>
  <text x="356" y="496" font-size="12" fill="#64748b">See the Payroll guides for</text>
  <text x="356" y="513" font-size="12" fill="#64748b">step-by-step pay processing.</text>

  <rect x="660" y="330" width="280" height="196" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <circle cx="684" cy="356" r="14" fill="#334155"/><text x="684" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
  <text x="706" y="361" font-size="15" font-weight="700" fill="#334155">Exit (resign / terminate)</text>
  <text x="676" y="392" font-size="13" fill="#334155">Employee &#8594; Status history:</text>
  <text x="676" y="414" font-size="13" fill="#334155">add RESIGNED + effective date</text>
  <text x="676" y="436" font-size="13" fill="#334155">Job tab &#8594; Exit date &#8594; Save job</text>
  <text x="676" y="458" font-size="13" fill="#334155">Final pay &#8594; Payroll guides</text>
  <text x="676" y="480" font-size="13" fill="#334155">Click Deactivate (last step)</text>
  <text x="676" y="513" font-size="12" fill="#64748b">Records are kept, never deleted.</text>

  <!-- Arrows row 1 -->
  <line x1="300" y1="176" x2="337" y2="176" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="620" y1="176" x2="657" y2="176" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- Row 1 to row 2 connector -->
  <path d="M800,274 L800,300 L160,300 L160,327" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- Arrows row 2 -->
  <line x1="300" y1="428" x2="337" y2="428" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="620" y1="428" x2="657" y2="428" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Monthly loop -->
  <path d="M480,526 L480,556 L950,556 L950,232 L943,232" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao)"/>
  <rect x="560" y="545" width="270" height="22" rx="6" fill="#ffffff"/>
  <text x="695" y="561" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2410c">Steps 3 &#8594; 4 &#8594; 5 repeat every month</text>
</svg>
