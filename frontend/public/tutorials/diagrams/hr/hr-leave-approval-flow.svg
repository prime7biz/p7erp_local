<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Leave request &#8594; approval &#8594; balance</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">Words in CAPITALS are what you see in the Status column</text>

  <!-- 1 Request -->
  <rect x="15" y="98" width="175" height="84" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="102" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">1. Request entered</text>
  <text x="102" y="146" text-anchor="middle" font-size="12" fill="#334155">Self-Service &#8594; My Leave</text>
  <text x="102" y="164" text-anchor="middle" font-size="12" fill="#334155">or Leave &#8594; Requests</text>

  <!-- 2 Balance check -->
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#64748b">checked for paid types with an allocation</text>
  <polygon points="300,84 380,140 300,196 220,140" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Enough</text>
  <text x="300" y="153" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">balance?</text>

  <!-- 3 Approval needed -->
  <polygon points="490,84 570,140 490,196 410,140" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Leave type</text>
  <text x="490" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">"Requires</text>
  <text x="490" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">approval"?</text>

  <!-- 4 Pending -->
  <rect x="600" y="98" width="160" height="84" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="680" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">PENDING</text>
  <text x="680" y="146" text-anchor="middle" font-size="12" fill="#334155">Days reserved in</text>
  <text x="680" y="164" text-anchor="middle" font-size="12" fill="#334155">Balances &#8594; Pending</text>

  <!-- 5 Manager -->
  <rect x="785" y="98" width="160" height="84" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="865" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">2. Manager</text>
  <text x="865" y="144" text-anchor="middle" font-size="12" fill="#334155">Leave &#8594; Approvals</text>
  <text x="865" y="162" text-anchor="middle" font-size="12" fill="#334155">Actions &#8594; Approve</text>
  <text x="865" y="177" text-anchor="middle" font-size="12" fill="#334155">or Reject</text>

  <!-- Blocked -->
  <rect x="215" y="250" width="170" height="74" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Blocked &#8212; not saved</text>
  <text x="300" y="294" text-anchor="middle" font-size="11.5" fill="#334155">"Insufficient leave balance:</text>
  <text x="300" y="310" text-anchor="middle" font-size="11.5" fill="#334155">available X, requested Y"</text>

  <!-- Auto approved -->
  <rect x="405" y="250" width="170" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="490" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">APPROVED (auto)</text>
  <text x="490" y="294" text-anchor="middle" font-size="11.5" fill="#334155">No approval needed &#8212;</text>
  <text x="490" y="310" text-anchor="middle" font-size="11.5" fill="#334155">days go straight to Used</text>

  <!-- Rejected -->
  <rect x="600" y="250" width="160" height="74" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">REJECTED</text>
  <text x="680" y="294" text-anchor="middle" font-size="11.5" fill="#334155">Pending days are</text>
  <text x="680" y="310" text-anchor="middle" font-size="11.5" fill="#334155">given back</text>

  <!-- Approved -->
  <rect x="785" y="250" width="160" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="865" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">APPROVED</text>
  <text x="865" y="294" text-anchor="middle" font-size="11.5" fill="#334155">Days move from</text>
  <text x="865" y="310" text-anchor="middle" font-size="11.5" fill="#334155">Pending to Used</text>

  <!-- After approval -->
  <rect x="15" y="380" width="930" height="110" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="35" y="408" font-size="14" font-weight="700" fill="#0f766e">3. What approved leave changes</text>
  <text x="35" y="432" font-size="13" fill="#334155">&#8226; Leave &#8594; Calendar lists it for that month      &#8226; Leave &#8594; Balances: Used goes up, Closing goes down</text>
  <text x="35" y="454" font-size="13" fill="#334155">&#8226; HR Reports &#8594; Leave Report: counted as Approved      &#8226; Payroll auto-calculate: counted as paid or unpaid leave days</text>
  <text x="35" y="476" font-size="13" fill="#334155">&#8226; Attendance &#8594; Summary counts Leave only from daily entries saved with Status LEAVE &#8212; mark those days too</text>

  <!-- Arrows -->
  <line x1="190" y1="140" x2="218" y2="140" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="380" y1="140" x2="408" y2="140" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="394" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Yes</text>
  <line x1="300" y1="196" x2="300" y2="247" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="312" y="226" font-size="11.5" font-weight="700" fill="#b91c1c">No</text>
  <line x1="570" y1="140" x2="597" y2="140" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="584" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">Yes</text>
  <line x1="490" y1="196" x2="490" y2="247" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="502" y="226" font-size="11.5" font-weight="700" fill="#0f766e">No</text>
  <line x1="760" y1="140" x2="782" y2="140" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="865" y1="182" x2="865" y2="247" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="877" y="222" font-size="11.5" font-weight="700" fill="#0f766e">Approve</text>
  <path d="M820,182 C820,215 700,215 690,247" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="742" y="208" font-size="11.5" font-weight="700" fill="#b91c1c">Reject</text>
  <line x1="490" y1="324" x2="490" y2="377" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="865" y1="324" x2="865" y2="377" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
</svg>
