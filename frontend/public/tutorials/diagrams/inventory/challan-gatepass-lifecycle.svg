<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Delivery challan and gate pass &#8212; status steps</text>

  <!-- Delivery challan -->
  <text x="20" y="68" font-size="14" font-weight="700" fill="#0f766e">Delivery challan (Workflow buttons on the challan page)</text>
  <g font-size="13" font-weight="700">
    <rect x="20" y="80" width="130" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="85" y="110" text-anchor="middle" fill="#334155">DRAFT</text>
    <rect x="172" y="80" width="130" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="237" y="110" text-anchor="middle" fill="#0f766e">SUBMITTED</text>
    <rect x="324" y="80" width="130" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="389" y="110" text-anchor="middle" fill="#0f766e">CHECKED</text>
    <rect x="476" y="80" width="130" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="541" y="110" text-anchor="middle" fill="#0f766e">RECOMMENDED</text>
    <rect x="628" y="80" width="130" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="693" y="110" text-anchor="middle" fill="#0f766e">APPROVED</text>
    <rect x="780" y="80" width="160" height="50" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
    <text x="860" y="103" text-anchor="middle" fill="#ffffff">POSTED</text>
    <text x="860" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="#ccfbf1">stock OUT &#183; final</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="150" y1="105" x2="169" y2="105"/>
    <line x1="302" y1="105" x2="321" y2="105"/>
    <line x1="454" y1="105" x2="473" y2="105"/>
    <line x1="606" y1="105" x2="625" y2="105"/>
    <line x1="758" y1="105" x2="777" y2="105"/>
  </g>
  <rect x="324" y="160" width="130" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="389" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">REJECTED</text>
  <path d="M324 182 H85 V133" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <text x="200" y="176" text-anchor="middle" font-size="12" fill="#c2410c">fix, then back to DRAFT</text>
  <g font-size="12" fill="#475569">
    <text x="480" y="182">Steps may be skipped (for example DRAFT &#8594; POSTED).</text>
    <text x="480" y="199">POSTED checks stock, takes it OUT and cannot be undone &#8212;</text>
    <text x="480" y="216">correct mistakes with a stock adjustment. Then Create Invoice.</text>
  </g>

  <line x1="20" y1="240" x2="940" y2="240" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Gate pass -->
  <text x="20" y="270" font-size="14" font-weight="700" fill="#ea580c">Gate pass (security / yard release)</text>
  <g font-size="13" font-weight="700">
    <rect x="20" y="282" width="130" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="85" y="312" text-anchor="middle" fill="#334155">DRAFT</text>
    <rect x="172" y="282" width="130" height="50" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="237" y="312" text-anchor="middle" fill="#c2410c">SUBMITTED</text>
    <rect x="324" y="282" width="130" height="50" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="389" y="312" text-anchor="middle" fill="#c2410c">APPROVED</text>
    <rect x="476" y="282" width="150" height="50" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/>
    <text x="551" y="305" text-anchor="middle" fill="#ffffff">RELEASED</text>
    <text x="551" y="322" text-anchor="middle" font-size="11" font-weight="400" fill="#ffedd5">vehicle may leave</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="150" y1="307" x2="169" y2="307"/>
    <line x1="302" y1="307" x2="321" y2="307"/>
    <line x1="454" y1="307" x2="473" y2="307"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="650" y="296">REJECTED is also possible.</text>
    <text x="650" y="313">Guard clicks Toggle guard</text>
    <text x="650" y="330">acknowledgement at the gate.</text>
  </g>
  <text x="480" y="380" text-anchor="middle" font-size="12" fill="#64748b">Both documents print with a QR code. Scanning it opens the verification record, so a fake or edited paper copy is easy to spot.</text>
</svg>
