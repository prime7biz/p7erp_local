<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">When does stock really move? Save first, post second</text>

  <!-- Row labels -->
  <g font-size="14" font-weight="700" fill="#334155">
    <text x="20" y="92">Warehouse transfer</text>
    <text x="20" y="172">Stock adjustment</text>
    <text x="20" y="252">Material issue (PMI)</text>
  </g>

  <!-- Transfer -->
  <rect x="200" y="66" width="150" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="275" y="93" text-anchor="middle" font-size="13" fill="#334155">Save draft</text>
  <rect x="380" y="66" width="110" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="435" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DRAFT</text>
  <rect x="520" y="70" width="180" height="36" rx="18" fill="#334155"/>
  <text x="610" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Actions &#8594; Post to stock</text>
  <rect x="730" y="66" width="210" height="44" rx="10" fill="#0f766e"/>
  <text x="835" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">POSTED</text>
  <text x="835" y="102" text-anchor="middle" font-size="11" fill="#ccfbf1">OUT of "from" + IN to "to"</text>

  <!-- Adjustment -->
  <rect x="200" y="146" width="150" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="275" y="173" text-anchor="middle" font-size="13" fill="#334155">Save draft adjustment</text>
  <rect x="380" y="146" width="110" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="435" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DRAFT</text>
  <rect x="520" y="150" width="180" height="36" rx="18" fill="#334155"/>
  <text x="610" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Actions &#8594; Post to stock</text>
  <rect x="730" y="146" width="210" height="44" rx="10" fill="#0f766e"/>
  <text x="835" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">POSTED</text>
  <text x="835" y="182" text-anchor="middle" font-size="11" fill="#ccfbf1">+ qty = IN &#183; &#8722; qty = OUT</text>

  <!-- PMI -->
  <rect x="200" y="226" width="290" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="345" y="253" text-anchor="middle" font-size="13" fill="#c2410c">Post production material issue</text>
  <rect x="730" y="226" width="210" height="44" rx="10" fill="#ea580c"/>
  <text x="835" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">POSTED at once</text>
  <text x="835" y="262" text-anchor="middle" font-size="11" fill="#ffedd5">OUT per BOM line &#183; no draft</text>

  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="350" y1="88" x2="377" y2="88"/>
    <line x1="490" y1="88" x2="517" y2="88"/>
    <line x1="700" y1="88" x2="727" y2="88"/>
    <line x1="350" y1="168" x2="377" y2="168"/>
    <line x1="490" y1="168" x2="517" y2="168"/>
    <line x1="700" y1="168" x2="727" y2="168"/>
    <line x1="490" y1="248" x2="727" y2="248"/>
  </g>

  <text x="480" y="306" text-anchor="middle" font-size="12" fill="#64748b">A DRAFT changes nothing in stock. Posting checks that enough stock exists (for OUT movements) and writes the movement to the Ledger.</text>
</svg>
