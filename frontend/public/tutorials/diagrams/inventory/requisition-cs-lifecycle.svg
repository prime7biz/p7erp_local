<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Requisition and Comparative Statement (CS) &#8212; status steps</text>

  <g font-size="13" font-weight="700">
    <rect x="20" y="80" width="140" height="60" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="90" y="115" text-anchor="middle" fill="#334155">Draft</text>
    <rect x="210" y="80" width="140" height="60" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="280" y="115" text-anchor="middle" fill="#0f766e">Submitted</text>
    <rect x="400" y="80" width="170" height="60" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="485" y="106" text-anchor="middle" fill="#0f766e">Approved &#8212;</text>
    <text x="485" y="124" text-anchor="middle" fill="#0f766e">collecting quotations</text>
    <rect x="620" y="80" width="150" height="60" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="695" y="115" text-anchor="middle" fill="#0f766e">Supplier selected</text>
    <rect x="820" y="80" width="120" height="60" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
    <text x="880" y="115" text-anchor="middle" fill="#ffffff">PO created</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="160" y1="110" x2="207" y2="110"/>
    <line x1="350" y1="110" x2="397" y2="110"/>
    <line x1="570" y1="110" x2="617" y2="110"/>
    <line x1="770" y1="110" x2="817" y2="110"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="90" y="162">New requisition &#8594;</text>
    <text x="90" y="178">Save draft</text>
    <text x="280" y="162">Click Submit</text>
    <text x="280" y="178">(requester)</text>
    <text x="485" y="162">Admin / manager: Approve.</text>
    <text x="485" y="178">Add supplier quotations</text>
    <text x="695" y="162">Select under a supplier</text>
    <text x="695" y="178">+ reason (required)</text>
    <text x="880" y="162">Create PO &#8594;</text>
    <text x="880" y="178">DRAFT PO</text>
  </g>

  <rect x="210" y="220" width="140" height="48" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="280" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Rejected</text>
  <path d="M280 186 V217" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <path d="M210 244 H90 V190" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <text x="380" y="240" font-size="12" fill="#c2410c">Reject needs a reason. The requester edits and submits again.</text>
  <text x="380" y="258" font-size="12" fill="#475569">Cancelled is also possible (with a reason). History at the bottom shows every step.</text>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#64748b">The CS shows the lowest price on each line in green and ranks totals of suppliers who priced every line.</text>
</svg>
