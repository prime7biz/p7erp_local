<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Line booking (reservation) lifecycle on the line plan board</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#334155">Line booking lifecycle (the small tag on each block)</text>
  <text x="24" y="56" font-size="12" fill="#64748b">Each block on the Line plan board is one order booked on one sewing line. The tag shows how firm the booking is.</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="24" y="86" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="99" y="119" fill="#334155">DRAFT</text>
    <rect x="214" y="86" width="160" height="56" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="294" y="119" fill="#0369a1">SOFT BOOKED</text>
    <rect x="414" y="86" width="160" height="56" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="494" y="119" fill="#0f766e">FIRM BOOKED</text>
    <rect x="614" y="86" width="150" height="56" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="689" y="119" fill="#c2410c">IN PROGRESS</text>
    <rect x="804" y="86" width="132" height="56" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="870" y="119" fill="#334155">COMPLETED</text>
  </g>
  <line x1="174" y1="114" x2="210" y2="114" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="374" y1="114" x2="410" y2="114" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="574" y1="114" x2="610" y2="114" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="764" y1="114" x2="800" y2="114" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M99 172 C 99 190, 494 190, 494 176" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="296" y="204" font-size="11" fill="#64748b" text-anchor="middle">DRAFT can also go straight to FIRM</text>

  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="99" y="164">proposed line + dates</text>
    <text x="294" y="164">capacity held, can move</text>
    <text x="494" y="164">materials &#8805; 80% ready</text>
    <text x="689" y="164">sewing has started</text>
    <text x="870" y="164">sewing finished</text>
  </g>

  <rect x="24" y="212" width="440" height="100" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="236" font-size="13" font-weight="700" fill="#9a3412">Firm booking rule</text>
  <text x="40" y="258" font-size="12" fill="#7c2d12">FIRM needs the order's material readiness at or above</text>
  <text x="40" y="276" font-size="12" fill="#7c2d12">the company threshold (default 80%). Otherwise the system</text>
  <text x="40" y="294" font-size="12" fill="#7c2d12">says "Material readiness &#8230;% is below firm booking threshold".</text>

  <rect x="484" y="212" width="452" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="236" font-size="13" font-weight="700" fill="#334155">Block colour = plan status</text>
  <rect x="500" y="248" width="16" height="12" rx="3" fill="#3b82f6"/><text x="522" y="258" font-size="12" fill="#334155">planned</text>
  <rect x="600" y="248" width="16" height="12" rx="3" fill="#059669"/><text x="622" y="258" font-size="12" fill="#334155">active</text>
  <rect x="690" y="248" width="16" height="12" rx="3" fill="#f59e0b"/><text x="712" y="258" font-size="12" fill="#334155">on hold</text>
  <rect x="790" y="248" width="16" height="12" rx="3" fill="#64748b"/><text x="812" y="258" font-size="12" fill="#334155">completed</text>
  <rect x="500" y="272" width="16" height="12" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="522" y="282" font-size="12" fill="#334155">red outline = planning conflict or blocked readiness</text>
  <text x="500" y="302" font-size="11" fill="#64748b">Dot on the block: green ready &#183; amber warning &#183; red blocked &#183; grey not started</text>
</svg>
