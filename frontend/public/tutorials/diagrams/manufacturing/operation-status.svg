<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Shop-floor operation status: pending, in progress, on hold, completed</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="280" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#334155">Operation status on Cutting / Sewing / Finishing (shop floor)</text>
  <text x="24" y="56" font-size="12" fill="#64748b">Each row in the operation queue is one step of a released work order. The button shown depends on the status.</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="96" width="170" height="60" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="125" y="131" fill="#334155">pending</text>
    <rect x="320" y="96" width="190" height="60" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="415" y="131" fill="#c2410c">in_progress</text>
    <rect x="320" y="200" width="190" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="415" y="233" fill="#92400e">on_hold</text>
    <rect x="640" y="96" width="190" height="60" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="735" y="131" fill="#0f766e">completed</text>
  </g>

  <line x1="210" y1="126" x2="316" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="263" y="116" font-size="12" text-anchor="middle" fill="#334155" font-weight="600">Start</text>

  <line x1="510" y1="126" x2="636" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="573" y="104" font-size="12" text-anchor="middle" fill="#334155" font-weight="600">Complete</text>
  <text x="573" y="118" font-size="11" text-anchor="middle" fill="#64748b">(In / Out / Scrap qty)</text>

  <path d="M385 156 L385 196" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="378" y="182" font-size="12" text-anchor="end" fill="#334155" font-weight="600">Hold</text>
  <path d="M445 200 L445 160" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="452" y="182" font-size="12" fill="#334155" font-weight="600">Resume</text>
  <path d="M320 228 C 220 228, 140 200, 125 160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="190" y="246" font-size="11" fill="#64748b" text-anchor="middle">Start is also shown for on_hold</text>

  <rect x="640" y="186" width="296" height="74" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="208" font-size="12.5" font-weight="700" fill="#9a3412">Downtime is separate</text>
  <text x="656" y="228" font-size="12" fill="#7c2d12">Log Downtime (Machine, Power, Material,</text>
  <text x="656" y="246" font-size="12" fill="#7c2d12">Manpower); a supervisor clicks Close when fixed.</text>
</svg>
