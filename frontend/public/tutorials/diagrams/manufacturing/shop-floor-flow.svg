<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Shop-floor flow: from confirmed order to delivery challan</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#334155">Shop-floor flow &#8212; one order from plan to challan</text>
  <text x="24" y="56" font-size="12" fill="#64748b">Top text: what happens. Small grey text: the P7 ERP screen you use (sidebar label).</text>

  <g font-size="13">
    <rect x="24" y="84" width="150" height="64" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="99" y="112" text-anchor="middle" font-weight="700" fill="#334155">1. Order</text>
    <text x="99" y="132" text-anchor="middle" font-size="12" fill="#475569">confirmed, BOM approved</text>

    <rect x="258" y="84" width="150" height="64" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="333" y="112" text-anchor="middle" font-weight="700" fill="#0f766e">2. Plan</text>
    <text x="333" y="132" text-anchor="middle" font-size="12" fill="#115e59">readiness chain checked</text>

    <rect x="492" y="84" width="170" height="64" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="577" y="112" text-anchor="middle" font-weight="700" fill="#0f766e">3. Line allocation</text>
    <text x="577" y="132" text-anchor="middle" font-size="12" fill="#115e59">soft &#8594; firm booking</text>

    <rect x="746" y="84" width="190" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="841" y="112" text-anchor="middle" font-weight="700" fill="#c2410c">4. Cutting</text>
    <text x="841" y="132" text-anchor="middle" font-size="12" fill="#9a3412">marker &#8594; lay &#8594; bundles</text>
  </g>
  <line x1="174" y1="116" x2="254" y2="116" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="408" y1="116" x2="488" y2="116" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="662" y1="116" x2="742" y2="116" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="11.5" fill="#475569">
    <text x="99" y="168" text-anchor="middle">Orders &#183; Order BOM</text>
    <text x="333" y="168" text-anchor="middle">Manufacturing &#8594; Planning</text>
    <text x="577" y="168" text-anchor="middle">Line plan board</text>
    <text x="841" y="168" text-anchor="middle">Cutting pipeline &#183; Hourly &#8212; Cutting</text>
  </g>

  <path d="M841 178 L841 236" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="13">
    <rect x="746" y="240" width="190" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="841" y="268" text-anchor="middle" font-weight="700" fill="#c2410c">5. Sewing</text>
    <text x="841" y="288" text-anchor="middle" font-size="12" fill="#9a3412">bundle scans, hourly output</text>

    <rect x="492" y="240" width="170" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="577" y="268" text-anchor="middle" font-weight="700" fill="#c2410c">6. Finishing</text>
    <text x="577" y="288" text-anchor="middle" font-size="12" fill="#9a3412">iron, finishing, pack</text>

    <rect x="258" y="240" width="150" height="64" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="333" y="268" text-anchor="middle" font-weight="700" fill="#0f766e">7. QC</text>
    <text x="333" y="288" text-anchor="middle" font-size="12" fill="#115e59">inline &#183; final &#183; NCR/CAPA</text>

    <rect x="24" y="240" width="150" height="64" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="99" y="268" text-anchor="middle" font-weight="700" fill="#334155">8. Packing / Challan</text>
    <text x="99" y="288" text-anchor="middle" font-size="12" fill="#475569">delivery challan posted</text>
  </g>
  <line x1="746" y1="272" x2="666" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="492" y1="272" x2="412" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="258" y1="272" x2="178" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="11.5" fill="#475569">
    <text x="841" y="324" text-anchor="middle">Scan station &#183; Hourly &#8212; Sewing</text>
    <text x="577" y="324" text-anchor="middle">Finishing (shop floor) &#183; Hourly</text>
    <text x="333" y="324" text-anchor="middle">Shop-floor QC &#183; Quality</text>
    <text x="99" y="324" text-anchor="middle">Inventory &#8594; Delivery Challans</text>
  </g>

  <rect x="24" y="344" width="912" height="44" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="363" font-size="12" font-weight="700" fill="#9a3412">Optional gates (admin switches, default off):</text>
  <text x="40" y="380" font-size="12" fill="#7c2d12">line_allocation_confirm_enabled (step 3) &#183; require_order_id_on_shop_floor (hourly, steps 4&#8211;6) &#183; capa_blocks_challan (open CAPA stops step 8)</text>
</svg>
