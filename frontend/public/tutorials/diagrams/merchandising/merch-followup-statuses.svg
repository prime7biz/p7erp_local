<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Statuses for TNA tasks, sample requests and critical alerts</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Follow-up statuses: TNA tasks, samples and alerts</text>
  <text x="480" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Green text = the menu item or button that makes the move</text>

  <!-- TNA -->
  <text x="20" y="84" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="1">TNA TASK (Follow-up TNA &#8594; Actions)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="96" width="130" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="85" y="123" fill="#334155">pending</text>
    <rect x="190" y="96" width="130" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="255" y="123" fill="#334155">in_progress</text>
    <rect x="360" y="96" width="130" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="425" y="123" fill="#075985">submitted</text>
    <rect x="530" y="96" width="130" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="595" y="123" fill="#0f766e">approved</text>
    <rect x="700" y="96" width="130" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.2"/><text x="765" y="123" fill="#0f766e">completed</text>
    <rect x="360" y="170" width="130" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="425" y="195" fill="#991b1b">rejected</text>
    <rect x="530" y="170" width="130" height="40" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="595" y="195" fill="#075985">resubmitted</text>
    <rect x="850" y="96" width="90" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="895" y="115" fill="#475569" font-size="11">on_hold /</text><text x="895" y="131" fill="#475569" font-size="11">cancelled</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#arr)">
    <line x1="150" y1="118" x2="186" y2="118"/>
    <line x1="320" y1="118" x2="356" y2="118"/>
    <line x1="490" y1="118" x2="526" y2="118"/>
    <line x1="660" y1="118" x2="696" y2="118"/>
    <line x1="425" y1="140" x2="425" y2="166"/>
    <line x1="490" y1="190" x2="526" y2="190"/>
    <path d="M 595 170 C 595 158, 470 158, 470 144" fill="none"/>
  </g>
  <g font-size="11.5" fill="#0f766e" text-anchor="middle">
    <text x="300" y="156">Mark submitted</text>
    <text x="262" y="188">Mark rejected (reason +</text>
    <text x="262" y="202">resubmission date)</text>
    <text x="765" y="160">Complete (Reopen undoes it)</text>
  </g>

  <!-- Samples -->
  <text x="20" y="252" font-size="13" font-weight="700" fill="#ea580c" letter-spacing="1">SAMPLE REQUEST (Sample Development &#8594; open a sample)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="264" width="150" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="95" y="291" fill="#334155">requested</text>
    <rect x="230" y="264" width="150" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="305" y="291" fill="#334155">in_progress</text>
    <rect x="440" y="264" width="150" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="515" y="291" fill="#075985">submitted</text>
    <rect x="650" y="252" width="140" height="34" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="720" y="274" fill="#0f766e">approved</text>
    <rect x="650" y="292" width="140" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="720" y="314" fill="#991b1b">rejected</text>
    <rect x="830" y="264" width="110" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="885" y="291" fill="#475569">cancelled</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#arr)">
    <line x1="170" y1="286" x2="226" y2="286"/>
    <line x1="380" y1="286" x2="436" y2="286"/>
    <line x1="590" y1="280" x2="646" y2="270"/>
    <line x1="590" y1="292" x2="646" y2="308"/>
  </g>
  <g font-size="11.5" fill="#0f766e" text-anchor="middle">
    <text x="198" y="326">Start (in progress)</text>
    <text x="408" y="326">Mark submitted</text>
    <text x="618" y="344">Approve / Reject</text>
    <text x="885" y="326" fill="#64748b">Cancel (before submit)</text>
  </g>

  <!-- Alerts -->
  <text x="20" y="378" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">CRITICAL ALERT (Critical Alerts &#8594; Open)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="390" width="130" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="85" y="417" fill="#991b1b">new</text>
    <rect x="200" y="390" width="140" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="270" y="417" fill="#334155">acknowledged</text>
    <rect x="390" y="390" width="130" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="455" y="417" fill="#075985">in_progress</text>
    <rect x="570" y="390" width="130" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="635" y="417" fill="#0f766e">resolved</text>
    <rect x="740" y="390" width="200" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="840" y="410" fill="#9a3412" font-size="12">snoozed / escalated</text><text x="840" y="426" fill="#475569" font-size="11" font-weight="400">Snooze 1 day &#183; Escalate alert</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#arr)">
    <line x1="150" y1="412" x2="196" y2="412"/>
    <line x1="340" y1="412" x2="386" y2="412"/>
    <line x1="520" y1="412" x2="566" y2="412"/>
  </g>
  <g font-size="11.5" fill="#0f766e" text-anchor="middle">
    <text x="173" y="452">Acknowledge</text>
    <text x="363" y="452">In progress</text>
    <text x="543" y="452">Resolve</text>
  </g>
</svg>
