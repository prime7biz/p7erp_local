<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Order status and the 12-stage order pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">An order has two progress markers</text>

  <!-- Part 1: order status -->
  <text x="20" y="64" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="1">A. ORDER STATUS (small dropdown + Update status on the order page)</text>
  <g>
    <rect x="20" y="78" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="95" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">DRAFT</text>
    <text x="95" y="122" text-anchor="middle" font-size="11" fill="#475569">order typed by hand</text>
  </g>
  <g>
    <rect x="230" y="78" width="150" height="56" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="305" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">NEW</text>
    <text x="305" y="122" text-anchor="middle" font-size="11" fill="#475569">made from a quotation</text>
  </g>
  <g>
    <rect x="440" y="78" width="150" height="56" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="515" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">CONFIRMED</text>
    <text x="515" y="122" text-anchor="middle" font-size="11" fill="#475569">commercial terms locked</text>
  </g>
  <g>
    <rect x="650" y="78" width="160" height="56" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="730" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">IN PROGRESS /</text>
    <text x="730" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">COMPLETED</text>
    <text x="730" y="129" text-anchor="middle" font-size="10" fill="#475569">also locked</text>
  </g>
  <g>
    <rect x="850" y="78" width="90" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="895" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">CANCELLED</text>
  </g>
  <line x1="170" y1="106" x2="226" y2="106" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 120 134 C 180 168, 400 168, 470 138" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#0f766e">Draft can go straight to Confirmed</text>
  <text x="840" y="160" text-anchor="end" font-size="11" fill="#64748b">Any status can be cancelled (needs care: it stops the job)</text>

  <!-- Part 2: pipeline -->
  <text x="20" y="208" font-size="13" font-weight="700" fill="#ea580c" letter-spacing="1">B. ORDER PIPELINE (moves by itself when the real document is saved)</text>

  <g font-size="12">
    <!-- row 1 -->
    <rect x="20" y="222" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="90" y="244" text-anchor="middle" font-weight="700" fill="#334155">1 Inquiry</text>
    <text x="90" y="264" text-anchor="middle" fill="#64748b">buyer request</text>
    <rect x="176" y="222" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="246" y="244" text-anchor="middle" font-weight="700" fill="#334155">2 Quotation</text>
    <text x="246" y="264" text-anchor="middle" fill="#64748b">price offered</text>
    <rect x="332" y="222" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="402" y="244" text-anchor="middle" font-weight="700" fill="#0f766e">3 Order confirmed</text>
    <text x="402" y="264" text-anchor="middle" fill="#64748b">order is live</text>
    <rect x="488" y="222" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="558" y="244" text-anchor="middle" font-weight="700" fill="#334155">4 PI issued</text>
    <text x="558" y="264" text-anchor="middle" fill="#64748b">proforma invoice</text>
    <rect x="644" y="222" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="714" y="244" text-anchor="middle" font-weight="700" fill="#334155">5 LC received</text>
    <text x="714" y="264" text-anchor="middle" fill="#64748b">export LC in hand</text>
    <text x="714" y="282" text-anchor="middle" fill="#94a3b8" font-size="11">N/A for local orders</text>
    <rect x="800" y="222" width="140" height="74" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="870" y="244" text-anchor="middle" font-weight="700" fill="#9a3412">6 BOM created</text>
    <text x="870" y="264" text-anchor="middle" fill="#64748b">order BOM approved</text>
    <text x="870" y="280" text-anchor="middle" fill="#64748b">or frozen</text>

    <!-- row 2 (right to left) -->
    <rect x="800" y="336" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="358" text-anchor="middle" font-weight="700" fill="#334155">7 PO issued</text>
    <text x="870" y="378" text-anchor="middle" fill="#64748b">materials ordered</text>
    <rect x="644" y="336" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="714" y="358" text-anchor="middle" font-weight="700" fill="#334155">8 RM received</text>
    <text x="714" y="378" text-anchor="middle" fill="#64748b">GRN: fabric/trims in</text>
    <rect x="488" y="336" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="558" y="358" text-anchor="middle" font-weight="700" fill="#334155">9 In production</text>
    <text x="558" y="378" text-anchor="middle" fill="#64748b">cutting / sewing</text>
    <rect x="332" y="336" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="402" y="358" text-anchor="middle" font-weight="700" fill="#334155">10 Shipped</text>
    <text x="402" y="378" text-anchor="middle" fill="#64748b">challan POSTED</text>
    <rect x="176" y="336" width="140" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="246" y="358" text-anchor="middle" font-weight="700" fill="#334155">11 Payment received</text>
    <text x="246" y="378" text-anchor="middle" fill="#64748b">receipt posted</text>
    <rect x="20" y="336" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="90" y="358" text-anchor="middle" font-weight="700" fill="#0f766e">12 Completed</text>
    <text x="90" y="378" text-anchor="middle" fill="#64748b">job closed</text>
  </g>
  <g stroke="#334155" stroke-width="1.8" marker-end="url(#arr)">
    <line x1="160" y1="259" x2="172" y2="259"/>
    <line x1="316" y1="259" x2="328" y2="259"/>
    <line x1="472" y1="259" x2="484" y2="259"/>
    <line x1="628" y1="259" x2="640" y2="259"/>
    <line x1="784" y1="259" x2="796" y2="259"/>
    <line x1="870" y1="296" x2="870" y2="332"/>
    <line x1="800" y1="373" x2="788" y2="373"/>
    <line x1="644" y1="373" x2="632" y2="373"/>
    <line x1="488" y1="373" x2="476" y2="373"/>
    <line x1="332" y1="373" x2="320" y2="373"/>
    <line x1="176" y1="373" x2="164" y2="373"/>
  </g>

  <rect x="20" y="436" width="920" height="66" rx="12" fill="#f1f5f9"/>
  <text x="40" y="462" font-size="13" fill="#334155"><tspan font-weight="700">You do not click the pipeline.</tspan> Do the real work (approve the BOM, raise the PO, post the GRN, post the challan) and</text>
  <text x="40" y="484" font-size="13" fill="#334155">the stage moves on. Steps that do not apply (for example LC on a local order) are ticked as N/A in Pipeline settings.</text>
</svg>
