<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Quotation status lifecycle with commercial lock</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Quotation status</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#64748b">Green text = the button you click. A quotation can become an order only after it is SENT.</text>

  <!-- lock band -->
  <rect x="392" y="74" width="546" height="138" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="665" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">COMMERCIAL LOCK: price, currency, terms, qty and dates change only through a change request</text>

  <g>
    <rect x="30" y="112" width="150" height="70" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="105" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">DRAFT / NEW</text>
    <text x="105" y="162" text-anchor="middle" font-size="12" fill="#475569">Build the costing</text>
  </g>
  <g>
    <rect x="215" y="112" width="150" height="70" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="290" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">SUBMITTED</text>
    <text x="290" y="162" text-anchor="middle" font-size="12" fill="#475569">Waiting for review</text>
  </g>
  <g>
    <rect x="410" y="112" width="150" height="70" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="485" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">APPROVED</text>
    <text x="485" y="162" text-anchor="middle" font-size="12" fill="#475569">Price agreed inside</text>
  </g>
  <g>
    <rect x="595" y="112" width="150" height="70" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="670" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">SENT</text>
    <text x="670" y="162" text-anchor="middle" font-size="12" fill="#475569">Offer is with the buyer</text>
  </g>
  <g>
    <rect x="780" y="112" width="150" height="70" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="855" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">CONVERTED</text>
    <text x="855" y="162" text-anchor="middle" font-size="12" fill="#475569">Order created</text>
  </g>

  <line x1="180" y1="147" x2="211" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="365" y1="147" x2="406" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="147" x2="591" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="147" x2="776" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="12" fill="#0f766e" text-anchor="middle">
    <text x="197" y="206">Submit for review</text>
    <text x="197" y="221">(or Actions &#8594; Submit)</text>
    <text x="385" y="232">Approve</text>
    <text x="578" y="232">Actions &#8594; Send</text>
    <text x="762" y="232">Create Order /</text>
    <text x="762" y="247">Convert to order</text>
  </g>

  <!-- final branches -->
  <rect x="215" y="280" width="200" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="315" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">REJECTED</text>
  <text x="315" y="323" text-anchor="middle" font-size="12" fill="#475569">from Submitted, Approved or Sent</text>
  <rect x="470" y="280" width="200" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">CANCELLED</text>
  <text x="570" y="323" text-anchor="middle" font-size="12" fill="#475569">from any open status</text>
  <rect x="720" y="280" width="210" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="825" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Need a new price?</text>
  <text x="825" y="321" text-anchor="middle" font-size="12" fill="#475569">Duplicate as new version</text>
  <line x1="290" y1="182" x2="300" y2="276" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="485" y1="182" x2="540" y2="276" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
