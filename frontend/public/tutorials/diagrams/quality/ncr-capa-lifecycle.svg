<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>NCR and CAPA lifecycle</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="350" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#334155">NCR and CAPA lifecycle</text>
  <text x="24" y="56" font-size="12" fill="#64748b">NCR = non-conformance report (the problem). CAPA = corrective and preventive action (the fix). One CAPA per NCR.</text>

  <!-- NCR row -->
  <text x="24" y="92" font-size="13" font-weight="700" fill="#c2410c">NCR</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="80" y="72" width="150" height="48" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="155" y="101" fill="#c2410c">open</text>
    <rect x="320" y="72" width="170" height="48" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="405" y="101" fill="#c2410c">in_progress</text>
    <rect x="580" y="72" width="150" height="48" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="655" y="101" fill="#334155">closed</text>
  </g>
  <line x1="230" y1="96" x2="316" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273" y="88" font-size="11" text-anchor="middle" fill="#334155">In Progress</text>
  <line x1="490" y1="96" x2="576" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="533" y="88" font-size="11" text-anchor="middle" fill="#334155">Close</text>
  <path d="M655 120 C 655 150, 405 150, 405 124" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="530" y="158" font-size="11" text-anchor="middle" fill="#64748b">Reopen (note required)</text>

  <!-- link -->
  <path d="M155 120 L155 196" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="164" y="164" font-size="11.5" fill="#334155">Create CAPA (NCR ID) or Quick CAPA</text>

  <!-- CAPA row -->
  <text x="24" y="226" font-size="13" font-weight="700" fill="#0f766e">CAPA</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="80" y="200" width="150" height="48" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="155" y="229" fill="#0f766e">open</text>
    <rect x="320" y="200" width="170" height="48" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="405" y="229" fill="#0f766e">in_progress</text>
    <rect x="580" y="200" width="150" height="48" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="655" y="229" fill="#334155">closed</text>
  </g>
  <line x1="230" y1="224" x2="316" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273" y="216" font-size="11" text-anchor="middle" fill="#334155">In Progress</text>
  <line x1="490" y1="224" x2="576" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="533" y="216" font-size="11" text-anchor="middle" fill="#334155">Close</text>
  <path d="M655 248 C 655 278, 405 278, 405 252" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="530" y="286" font-size="11" text-anchor="middle" fill="#64748b">Reopen (note required)</text>

  <!-- gate -->
  <rect x="770" y="72" width="166" height="176" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="853" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">Challan gate</text>
  <text x="786" y="122" font-size="11.5" fill="#7c2d12">If capa_blocks_challan</text>
  <text x="786" y="138" font-size="11.5" fill="#7c2d12">is on, a CAPA that is</text>
  <text x="786" y="154" font-size="11.5" fill="#7c2d12">open or in_progress for</text>
  <text x="786" y="170" font-size="11.5" fill="#7c2d12">the order stops posting</text>
  <text x="786" y="186" font-size="11.5" fill="#7c2d12">its delivery challan.</text>
  <text x="786" y="212" font-size="11.5" font-weight="700" fill="#7c2d12">Closed CAPA = gate</text>
  <text x="786" y="228" font-size="11.5" font-weight="700" fill="#7c2d12">opens.</text>
  <line x1="730" y1="224" x2="766" y2="224" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="304" width="912" height="34" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="326" font-size="12" fill="#475569">Severity on the NCR: Minor &#183; Major &#183; Critical. Pending CAPA and Open NCR counts appear on the QC Dashboard.</text>
</svg>
