<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#334155">Life of a support ticket</text>
  <text x="24" y="56" font-size="13" fill="#64748b">Support &#8594; New ticket. Status is shown in orange on My tickets and at the top of the ticket thread.</text>

  <g>
    <rect x="24" y="84" width="204" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <circle cx="46" cy="106" r="13" fill="#0f766e"/><text x="46" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="66" y="111" font-size="14" font-weight="700" fill="#334155">Write the ticket</text>
    <text x="38" y="136" font-size="12" fill="#334155">Title (short summary)</text>
    <text x="38" y="154" font-size="12" fill="#334155">Category: General, Billing,</text>
    <text x="38" y="172" font-size="12" fill="#334155">Technical, Access / users</text>
    <text x="38" y="190" font-size="12" fill="#334155">Priority: Low &#8230; Urgent</text>
    <text x="38" y="208" font-size="12" fill="#334155">Description (steps, error)</text>
  </g>
  <line x1="228" y1="160" x2="256" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="260" y="84" width="204" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <circle cx="282" cy="106" r="13" fill="#0f766e"/><text x="282" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="302" y="111" font-size="14" font-weight="700" fill="#334155">Submit ticket</text>
    <text x="274" y="136" font-size="12" fill="#334155">The thread opens at once:</text>
    <text x="274" y="154" font-size="12" fill="#334155">#number &#8212; title, and your</text>
    <text x="274" y="172" font-size="12" fill="#334155">Original request.</text>
    <rect x="274" y="190" width="56" height="20" rx="10" fill="#ffedd5"/><text x="302" y="204" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">open</text>
  </g>
  <line x1="464" y1="160" x2="492" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="496" y="84" width="208" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <circle cx="518" cy="106" r="13" fill="#0f766e"/><text x="518" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="538" y="111" font-size="14" font-weight="700" fill="#334155">Talk in the thread</text>
    <text x="510" y="136" font-size="12" fill="#334155">Platform team replies.</text>
    <text x="510" y="154" font-size="12" fill="#334155">You answer in the Reply</text>
    <text x="510" y="172" font-size="12" fill="#334155">box &#8594; Send reply.</text>
    <rect x="510" y="190" width="96" height="20" rx="10" fill="#ffedd5"/><text x="558" y="204" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">in progress</text>
  </g>
  <line x1="704" y1="160" x2="732" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="736" y="84" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
    <circle cx="758" cy="106" r="13" fill="#0f766e"/><text x="758" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="778" y="111" font-size="14" font-weight="700" fill="#334155">Closed</text>
    <text x="750" y="136" font-size="12" fill="#334155">The team closes it when</text>
    <text x="750" y="154" font-size="12" fill="#334155">solved. The Reply box is</text>
    <text x="750" y="172" font-size="12" fill="#334155">removed.</text>
    <rect x="750" y="190" width="64" height="20" rx="10" fill="#ffedd5"/><text x="782" y="204" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">closed</text>
  </g>

  <path d="M 836 234 L 836 268 L 126 268 L 126 238" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <rect x="300" y="256" width="360" height="24" rx="8" fill="#ffffff"/>
  <text x="480" y="273" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">Problem back? Open a NEW ticket and mention the old #number</text>

  <rect x="24" y="300" width="912" height="84" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="324" font-size="13" font-weight="700" fill="#0f766e">A good ticket answers 4 questions</text>
  <text x="40" y="346" font-size="12" fill="#334155">1. Which screen (menu path or the address in the browser)?   2. What did you click, step by step?</text>
  <text x="40" y="366" font-size="12" fill="#334155">3. What did you expect, and what happened instead (copy the exact red error text)?   4. Since when, and does it affect other users?</text>
</svg>
